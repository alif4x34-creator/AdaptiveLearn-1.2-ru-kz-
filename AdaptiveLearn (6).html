<!DOCTYPE html>
<html lang="ru"><head><meta charset="utf-8"><title>AdaptiveLearn</title>
<meta name="viewport" content="width=device-width, initial-scale=1, viewport-fit=cover">
<link rel="preconnect" href="https://fonts.googleapis.com"><link rel="preconnect" href="https://fonts.gstatic.com" crossorigin>
<link href="https://fonts.googleapis.com/css2?family=Nunito:wght@400;600;700;800;900&display=swap" rel="stylesheet">
<style>
@property --v{syntax:'<number>';inherits:false;initial-value:0}
:root{--bg:#FBF8F4;--card:#fff;--tx:#1C2B5E;--mut:#76728F;--pr:#7C4DDF;--pr2:#B08CF7;--ln:#ECE6F6;--side:#F3EEFC;--soft:#F7F3FF;--hv:#7C4DDF14;--ok:#3DBE8B;--okb:#E6F7EF;--wr:#F2A15F;--wrb:#FFF3E8;--er:#E0607E;--sun:#FFD36E;--peach:#FFB38A;
--g:linear-gradient(135deg,#7C4DDF 0%,#9A6CF0 55%,#C493F2 100%);--sh:0 1px 2px #1C2B5E08,0 10px 28px #7C4DDF12;
box-sizing:border-box;padding-top:env(safe-area-inset-top,0px);padding-bottom:env(safe-area-inset-bottom,0px);color-scheme:light}
:root[data-theme="dark"]{--bg:#15122A;--card:#201C38;--tx:#F2EFFF;--mut:#ABA5CC;--ln:#332D55;--side:#1B1832;--soft:#28234A;--hv:#ffffff12;--okb:#3DBE8B22;--wrb:#F2A15F22;--sh:0 10px 30px #0000004d;color-scheme:dark}
body,.card,aside,.opt,.item,.bot,input,select,textarea{transition:background-color .35s,color .35s,border-color .35s}
html{scroll-padding-top:env(safe-area-inset-top,0px)}
*{box-sizing:border-box}
body{margin:0;background:var(--bg);color:var(--tx);font:16px/1.55 Nunito,system-ui,-apple-system,"Segoe UI",Roboto,sans-serif;-webkit-font-smoothing:antialiased}
body::before{content:"";position:fixed;inset:0;z-index:-1;pointer-events:none;background:radial-gradient(circle at 8% 0%,#EAE1FF 0,transparent 38%),radial-gradient(circle at 96% 12%,#FFE8D8 0,transparent 32%),radial-gradient(circle at 70% 100%,#E2F5EC 0,transparent 38%)}
:root[data-theme="dark"] body::before{opacity:.12}
.app{display:flex;min-height:100vh;position:relative}
aside{width:224px;background:var(--side);color:var(--tx);padding:20px 14px;display:flex;flex-direction:column;gap:6px;flex:none;margin:14px 0 14px 14px;border-radius:26px;position:sticky;top:14px;height:calc(100vh - 28px);border:1px solid var(--ln)}
.logo{font-weight:900;font-size:18px;margin:0 8px 18px;display:flex;gap:10px;align-items:center;letter-spacing:-.2px}
.logo span b{color:var(--pr);font-weight:900}
.lg{width:38px;height:38px;border-radius:11px;box-shadow:0 4px 14px #7C4DDF33;flex:none;transition:transform .4s cubic-bezier(.34,1.56,.64,1)}.logo:hover .lg{transform:rotate(-6deg) scale(1.08)}
.hero{width:170px;height:170px;border-radius:38px;box-shadow:0 18px 44px #7C4DDF33;margin:0 auto 14px;display:block;animation:pop .7s cubic-bezier(.34,1.56,.64,1) both,float 5s 1s ease-in-out infinite}
@keyframes float{50%{transform:translateY(-6px)}}
aside button{all:unset;cursor:pointer;padding:11px 14px;border-radius:14px;color:var(--mut);font-weight:700;transition:.25s}
aside button:hover{background:var(--hv);color:var(--tx)}aside button.on{background:var(--pr);color:#fff;box-shadow:0 6px 16px #7C4DDF40}
main{flex:1;padding:26px 28px;min-width:0;max-width:1120px}
h1{font-size:26px;font-weight:900;margin:0 0 18px;letter-spacing:-.3px}h3{margin:0 0 10px;font-size:16px;font-weight:800}
.grid{display:grid;gap:16px}.c2{grid-template-columns:1fr 1fr}.c3{grid-template-columns:repeat(3,1fr)}
.card{background:var(--card);border:1px solid var(--ln);border-radius:24px;padding:20px;min-width:0;box-shadow:var(--sh)}
.mut{color:var(--mut);font-size:14px}.big{font-size:30px;font-weight:900}
.ring{width:116px;height:116px;border-radius:50%;background:conic-gradient(var(--pr) calc(var(--v)*1%),var(--ln) 0);display:grid;place-items:center;flex:none}
.ring b{width:90px;height:90px;border-radius:50%;background:var(--card);display:grid;place-items:center;font-size:24px;font-weight:900}
.cont{position:relative;overflow:hidden;background:var(--g);color:#fff;border-radius:24px;padding:22px;display:flex;justify-content:space-between;align-items:center;cursor:pointer;border:0;width:100%;text-align:left;font:inherit;transition:transform .25s,box-shadow .25s;box-shadow:0 10px 26px #7C4DDF40}
.cont::after{content:"";position:absolute;right:-30px;top:-40px;width:150px;height:150px;border-radius:50%;background:#ffffff1f}
.cont:hover{transform:translateY(-2px);box-shadow:0 14px 32px #7C4DDF55}.cont b{font-size:21px;font-weight:900;display:block}
.cont .go{width:46px;height:46px;border-radius:50%;background:#ffffff2e;display:grid;place-items:center;font-size:20px;position:relative;z-index:1}
.bar{height:9px;border-radius:9px;background:var(--ln);overflow:hidden}.bar i{display:block;height:100%;background:linear-gradient(90deg,var(--pr),var(--pr2));border-radius:9px;transition:width .8s cubic-bezier(.2,.8,.2,1)}
.row{display:flex;gap:12px;align-items:center}.sp{justify-content:space-between}
.item{display:flex;gap:12px;align-items:center;padding:12px 14px;border-radius:16px;background:var(--soft);margin-top:8px;cursor:pointer;border:0;width:100%;color:inherit;font:inherit;text-align:left;transition:.25s}
.item:hover:not(:disabled){transform:translateX(4px)}.item:disabled{opacity:.5;cursor:not-allowed}.item>div{flex:1;min-width:0}
.pill{background:#FFF1D2;color:#8A5A00;border-radius:20px;padding:3px 12px;font-size:13px;font-weight:800}
:root[data-theme="dark"] .pill{background:#FFD36E22;color:var(--sun)}
.btn{background:var(--g);color:#fff;border:0;border-radius:14px;padding:11px 18px;font:inherit;font-weight:800;cursor:pointer;transition:transform .2s,box-shadow .2s;box-shadow:0 6px 16px #7C4DDF33}
.btn:hover{transform:translateY(-1px);box-shadow:0 8px 20px #7C4DDF4d}.btn:disabled{opacity:.5;cursor:not-allowed}.btn.o{background:var(--card);color:var(--tx);border:1px solid var(--ln);box-shadow:none}.btn.o:hover{border-color:var(--pr2)}
.bot{background:var(--soft);border-radius:18px;padding:16px;margin-top:12px}.bot p{margin:6px 0 0}
.opt{display:block;width:100%;text-align:left;margin-top:10px;padding:14px 16px;border-radius:16px;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;font-weight:600;cursor:pointer;transition:.25s}
.opt:hover:not(:disabled){transform:translateX(4px);border-color:var(--pr2);background:var(--soft)}
.opt.ok{border-color:var(--ok);background:var(--okb)}.opt.no{border-color:var(--wr);background:var(--wrb)}
.fbk{border-left:5px solid var(--ok)}.fbk.soft{border-left-color:var(--wr)}
input,select,textarea{width:100%;padding:12px 14px;border-radius:14px;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;margin:6px 0 10px;outline:none}
input:focus,select:focus,textarea:focus{border-color:var(--pr2);box-shadow:0 0 0 4px #7C4DDF1f}
svg{width:100%;height:auto;display:block}.sc{overflow-x:auto}
.tag{font-size:12px;font-weight:800;padding:3px 10px;border-radius:10px;background:#7C4DDF1a;color:var(--pr)}
.er{color:var(--er)}
.leg{display:flex;gap:12px;flex-wrap:wrap;font-size:13px;color:var(--mut);margin-top:6px}.leg s{display:inline-block;width:10px;height:10px;border-radius:50%;margin-right:4px}
.st{display:flex;gap:10px;padding:12px;border-radius:14px;margin-top:8px;background:var(--soft)}.st.ok{border-left:4px solid var(--ok)}.st.bad{border-left:4px solid var(--wr)}
.ov{position:fixed;inset:0;display:grid;place-items:center;background:#1C2B5E66;backdrop-filter:blur(4px);padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));z-index:20;animation:fade .3s}
.md{background:var(--card);border-radius:30px;padding:30px;max-width:440px;width:100%;text-align:center;animation:pop .6s cubic-bezier(.34,1.56,.64,1);box-shadow:0 30px 60px #1C2B5E33}
.md .em{font-size:60px;animation:pulse 1.6s infinite}
.cf{position:fixed;top:-16px;left:var(--x);width:9px;height:14px;border-radius:3px;background:var(--c);animation:fall var(--d) ease-in var(--w) forwards;pointer-events:none}
.pl{animation:pulse 1.8s infinite;transform-box:fill-box;transform-origin:center}
.spin{width:22px;height:22px;border:3px solid var(--ln);border-top-color:var(--pr);border-radius:50%;animation:rot .8s linear infinite}
.tb{width:100%;border-collapse:collapse;font-size:14px}.tb td,.tb th{padding:10px 8px;text-align:left;border-bottom:1px solid var(--ln)}.tb tr.r{cursor:pointer;transition:.2s}.tb tr.r:hover{background:var(--soft)}.mono{font-family:ui-monospace,Menlo,monospace;background:var(--soft);padding:3px 8px;border-radius:8px;word-break:break-all}
.hello{display:flex;align-items:center;gap:14px;margin-bottom:18px}.hello h1{margin:0}.hello .mut{margin-top:2px}
@keyframes up{from{opacity:0;transform:translateY(16px)}}
@keyframes pop{from{opacity:0;transform:scale(.8)}}
@keyframes fade{from{opacity:0}}
@keyframes grow{from{width:0}}
@keyframes rg{from{--v:0}}
@keyframes pulse{50%{transform:scale(1.1)}}
@keyframes rot{to{transform:rotate(360deg)}}
@keyframes fall{to{transform:translate(var(--dx),108vh) rotate(720deg)}}
@keyframes nudge{30%{transform:translateX(3px)}60%{transform:translateX(-2px)}}
.in>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.in .grid>*{animation:up .55s cubic-bezier(.2,.8,.2,1) both}
.in .grid>*:nth-child(2){animation-delay:.1s}.in .grid>*:nth-child(3){animation-delay:.2s}
.in .bar i{animation:grow 1.1s .2s cubic-bezier(.2,.8,.2,1) both}.in .ring{animation:rg 1.3s .1s cubic-bezier(.2,.8,.2,1) both}
.in .item,.in .bot{animation:up .6s cubic-bezier(.2,.8,.2,1) both}.in .bot:nth-child(3){animation-delay:.1s}.in .bot:nth-child(4){animation-delay:.2s}.in .bot:nth-child(5){animation-delay:.3s}
.fs{position:fixed;inset:0;z-index:30;background:var(--bg);padding:max(16px,env(safe-area-inset-top)) 16px max(16px,env(safe-area-inset-bottom));overflow:auto;animation:fade .3s}
.card{transition:box-shadow .3s,border-color .3s,background-color .35s}.card:hover{box-shadow:0 2px 4px #1C2B5E08,0 14px 34px #7C4DDF1c}
.btn:active,.opt:active,.item:active,.cont:active{transform:scale(.97)}
.ring{transition:--v 1s cubic-bezier(.2,.8,.2,1)}
.opt.ok{animation:okp .55s}.opt.no{animation:nudge .5s}
.in>*:nth-child(2){animation-delay:.07s}.in>*:nth-child(3){animation-delay:.14s}.in>*:nth-child(4){animation-delay:.21s}.in>*:nth-child(5){animation-delay:.28s}.in>*:nth-child(6){animation-delay:.35s}
.in .grid>*:nth-child(4){animation-delay:.3s}.in .grid>*:nth-child(5){animation-delay:.4s}
.in .opt{animation:up .5s cubic-bezier(.2,.8,.2,1) both}.in .opt:nth-of-type(2){animation-delay:.06s}.in .opt:nth-of-type(3){animation-delay:.12s}.in .opt:nth-of-type(4){animation-delay:.18s}
.in .tb tr{animation:up .45s cubic-bezier(.2,.8,.2,1) both}
aside button{animation:slideR .5s cubic-bezier(.2,.8,.2,1) both}aside button:nth-child(2){animation-delay:.05s}aside button:nth-child(3){animation-delay:.1s}aside button:nth-child(4){animation-delay:.15s}aside button:nth-child(5){animation-delay:.2s}
.fs{animation:zoomIn .35s cubic-bezier(.2,.8,.2,1)}
.ov.out{animation:fadeOut .23s both}.ov.out .md{animation:popOut .23s both}.fs.out{animation:fsOut .25s both}
.nd{transition:transform .25s;transform-box:fill-box;transform-origin:center;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}.nd:hover{transform:scale(1.12)}
.ed{stroke-dasharray:var(--l);animation:dash 1s .25s cubic-bezier(.2,.8,.2,1) both}.ah{animation:fade .4s 1.1s both}
.fl{display:inline-block;animation:wig 2.4s ease-in-out infinite;transform-origin:50% 90%}
@keyframes okp{50%{transform:scale(1.03)}}
@keyframes slideR{from{opacity:0;transform:translateX(-14px)}}
@keyframes zoomIn{from{opacity:0;transform:scale(.93)}}
@keyframes fadeOut{to{opacity:0}}
@keyframes popOut{to{opacity:0;transform:scale(.9) translateY(10px)}}
@keyframes fsOut{to{opacity:0;transform:scale(.96)}}
@keyframes dash{from{stroke-dashoffset:var(--l)}}
@keyframes wig{0%,100%{transform:rotate(-6deg)}50%{transform:rotate(7deg) scale(1.12)}}
@media(max-width:820px){.app{flex-direction:column}aside{width:auto;height:auto;position:static;flex-direction:row;overflow-x:auto;padding:10px;margin:10px 10px 0;border-radius:20px}.logo{margin:0 6px 0 0;flex:none}.logo span{display:none}.lg{width:34px;height:34px}aside button{white-space:nowrap}.c2,.c3{grid-template-columns:1fr}main{padding:18px 14px}}
@media(prefers-reduced-motion:reduce){*{animation:none!important;transition:none!important}}

/* ===== v2: иконки, маскот, анимации ===== */
.i{width:1.15em;height:1.15em;display:inline-block;vertical-align:-.22em;flex:none}
.ib{all:unset;cursor:pointer;width:38px;height:38px;border-radius:12px;display:grid;place-items:center;color:var(--mut);transition:.2s}.ib:hover{background:var(--hv);color:var(--tx)}
aside button{display:flex;align-items:center;gap:10px}aside button .i{width:20px;height:20px}
aside button:hover .i{animation:wig .6s}
.btn,.opt,.item,.cont,aside button,.gcard{position:relative;overflow:hidden}
.btn{display:inline-flex;align-items:center;justify-content:center;gap:8px}
.rp{position:absolute;border-radius:50%;background:currentColor;opacity:.22;transform:scale(0);animation:rp .6s ease-out forwards;pointer-events:none;width:40px;height:40px;margin:-20px 0 0 -20px}
@keyframes rp{to{transform:scale(6);opacity:0}}
.bar i{background-size:200% 100%;background-image:linear-gradient(90deg,var(--pr),var(--pr2),var(--pr));animation:shim 3s linear infinite}
.in .bar i{animation:grow 1.1s .2s cubic-bezier(.2,.8,.2,1) both,shim 3s linear infinite}
@keyframes shim{to{background-position:-200% 0}}
/* фон */
#bgf{position:fixed;inset:0;z-index:-1;pointer-events:none;overflow:hidden}
#bgf span{position:absolute;color:var(--pr);opacity:.07;font-weight:900;animation:drift var(--d) ease-in-out infinite alternate;white-space:nowrap}
:root[data-theme="dark"] #bgf span{color:var(--pr2);opacity:.08}
@keyframes drift{from{transform:translate(0,0) rotate(-6deg)}to{transform:translate(var(--dx),var(--dy)) rotate(8deg)}}
/* маскот */
.mas{display:inline-block;flex:none;overflow:visible}
.mb{animation:bob 3s ease-in-out infinite}.mj{animation:jmp 1s ease-in-out infinite}
.mb,.mj{transform-box:view-box;transform-origin:60px 110px}
.eyes{animation:blink 4.5s infinite;transform-box:fill-box;transform-origin:center}
.leaf{animation:sway 3s ease-in-out infinite;transform-box:view-box;transform-origin:60px 32px}
.wv{animation:wave 1.4s ease-in-out infinite;transform-box:view-box;transform-origin:88px 70px}
.shd{animation:shd 3s ease-in-out infinite;transform-box:fill-box;transform-origin:center}
@keyframes bob{50%{transform:translateY(-5px)}}
@keyframes jmp{0%,100%{transform:translateY(0) scale(1)}15%{transform:translateY(0) scale(1.04,.94)}45%{transform:translateY(-12px) scale(.97,1.04)}}
@keyframes blink{0%,93%,100%{transform:scaleY(1)}96%{transform:scaleY(.1)}}
@keyframes sway{50%{transform:rotate(10deg)}}
@keyframes wave{50%{transform:rotate(-28deg)}}
@keyframes shd{50%{transform:scaleX(.82)}}
.say{display:flex;align-items:center;gap:12px;margin-bottom:16px}
.bub{position:relative;background:var(--card);border:1.5px solid var(--ln);border-radius:20px;padding:12px 16px;font-weight:700;box-shadow:var(--sh);animation:pop .5s .15s cubic-bezier(.34,1.56,.64,1) both;max-width:560px}
.bub::before{content:"";position:absolute;left:-8px;top:50%;margin-top:-7px;width:13px;height:13px;background:var(--card);border-left:1.5px solid var(--ln);border-bottom:1.5px solid var(--ln);transform:rotate(45deg)}
.hello{display:flex;align-items:center;gap:14px;margin-bottom:18px}
.hello .bub{margin-top:6px;font-weight:600;font-size:15px}
/* вопрос: выбор + проверка */
.opt.sel{border-color:var(--pr);background:var(--soft);box-shadow:0 0 0 3px #7C4DDF22;animation:selp .3s}
@keyframes selp{50%{transform:scale(1.015)}}
.opt .k{display:inline-grid;place-items:center;width:26px;height:26px;border-radius:8px;border:1.5px solid var(--ln);font-size:13px;font-weight:800;color:var(--mut);margin-right:10px;vertical-align:middle}
.opt.sel .k{border-color:var(--pr);color:var(--pr)}.opt.ok .k{border-color:var(--ok);color:var(--ok)}.opt.no .k{border-color:var(--wr);color:var(--wr)}
.qbar{display:flex;gap:10px;justify-content:flex-end;margin-top:16px;flex-wrap:wrap}
.sheet{margin-top:16px;border-radius:22px;padding:16px 18px;animation:sheetUp .45s cubic-bezier(.2,.8,.2,1) both}
.sheet.good{background:var(--okb);border:1.5px solid #3DBE8B55}.sheet.soft{background:var(--wrb);border:1.5px solid #F2A15F55}
.sheet .st-t{font-size:18px;font-weight:900}.sheet.good .st-t{color:#239B6E}.sheet.soft .st-t{color:#C9772F}
:root[data-theme="dark"] .sheet.good .st-t{color:#5CD6A6}:root[data-theme="dark"] .sheet.soft .st-t{color:#F7BE7E}
.sheet p{margin:6px 0 0}
.btn.gb{background:linear-gradient(135deg,#34B57F,#5CD6A6);box-shadow:0 6px 16px #3DBE8B44}
.btn.ob{background:linear-gradient(135deg,#EE9450,#F7BE7E);box-shadow:0 6px 16px #F2A15F44}
@keyframes sheetUp{from{opacity:0;transform:translateY(24px)}}
.xpf{position:fixed;z-index:40;font-weight:900;font-size:22px;color:#239B6E;pointer-events:none;animation:xpUp 1.2s cubic-bezier(.2,.8,.2,1) forwards;white-space:nowrap}
@keyframes xpUp{0%{opacity:0;transform:translate(-50%,0) scale(.6)}20%{opacity:1;transform:translate(-50%,-12px) scale(1.15)}100%{opacity:0;transform:translate(-50%,-80px) scale(1)}}
.spk{position:fixed;z-index:39;width:9px;height:9px;border-radius:50%;pointer-events:none;animation:spk .75s cubic-bezier(.2,.8,.2,1) forwards}
@keyframes spk{to{transform:translate(var(--dx),var(--dy)) scale(0);opacity:0}}
/* сердечки и тест */
.hearts{display:flex;gap:4px}.hearts .i{width:26px;height:26px}.hearts .lost{filter:grayscale(1);opacity:.35;animation:hlost .5s}
@keyframes hlost{30%{transform:scale(1.4)}100%{transform:scale(1)}}
.ptop{display:flex;align-items:center;gap:14px;margin-bottom:18px}.ptop .bar{flex:1;height:14px}
.gcard{display:flex;align-items:center;gap:14px;width:100%;text-align:left;padding:16px 18px;border-radius:20px;border:1.5px solid var(--ln);background:var(--card);color:var(--tx);font:inherit;cursor:pointer;margin-top:10px;transition:.25s;box-shadow:var(--sh)}
.gcard:hover{transform:translateY(-2px);border-color:var(--pr2)}.gcard b{font-size:17px;display:block}
.gic{width:52px;height:52px;border-radius:16px;display:grid;place-items:center;flex:none;font-size:26px}
.gic .i{width:28px;height:28px}
.chips{display:flex;flex-wrap:wrap;gap:8px;margin-top:10px}.chip{display:inline-flex;align-items:center;gap:6px;padding:6px 12px;border-radius:20px;background:var(--okb);color:#239B6E;font-weight:800;font-size:14px;animation:pop .5s cubic-bezier(.34,1.56,.64,1) both}
:root[data-theme="dark"] .chip{color:#5CD6A6}
.sic{width:34px;height:34px;border-radius:11px;display:inline-grid;place-items:center;vertical-align:middle;margin-right:8px}.sic .i{width:20px;height:20px}
.lockbox{display:flex;align-items:center;justify-content:space-between;gap:10px;flex-wrap:wrap;margin-top:6px}
.trial{border:1.5px dashed var(--pr2)}
.bh{display:flex;align-items:center;gap:8px}.bh .i{color:var(--pr)}
.ill{border-radius:16px;background:var(--card);padding:10px;margin-top:8px}.ill svg{max-height:190px}
.ill text{font-family:Nunito,system-ui,sans-serif;font-weight:700}
.gl{display:flex;justify-content:space-between;font-size:14px;margin-top:4px}
.stat{display:inline-flex;align-items:center;gap:4px}
.fl{display:inline-block;animation:flick 1.6s ease-in-out infinite;transform-origin:50% 90%}
@keyframes flick{0%,100%{transform:rotate(-4deg) scale(1)}50%{transform:rotate(5deg) scale(1.1)}}
.star{animation:tw 2.4s ease-in-out infinite;transform-origin:center}
@keyframes tw{50%{transform:rotate(18deg) scale(1.15)}}
.nd .gl2{pointer-events:none}
@media(max-width:820px){aside button span{display:none}aside button{padding:10px 12px}}

/* ===== v3: иконка-проводник, тёмная панель, смена темы ===== */
.mic{position:relative;display:inline-block;flex:none}.mic.mb,.mic.mj{animation:none}
.mic img{width:100%;height:100%;display:block;border-radius:26%;box-shadow:0 10px 24px #7C4DDF40;position:relative;z-index:1;user-select:none}

да/ρводы = {0}/{1} = {2}. Поэтому айсберг виден лишь «верхушкой».":"Су астындағы үлес = ρмұз/ρсу = {0}/{1} = {2}. Сондықтан айсбергтің тек «ұшы» көрінеді.","Луч падает на зеркало под углом {0}° к перпендикуляру. Под каким углом к перпендикуляру он отразится?":"Сәуле айнаға перпендикулярға {0}° бұрышпен түседі. Ол перпендикулярға қандай бұрышпен шағылады?","Угол отражения равен углу падения; оба отсчитывают от перпендикуляра.":"Шағылу бұрышы түсу бұрышына тең; екеуі де перпендикулярдан есептеледі.","Скорость света в стекле {0} {1} км/с, а в вакууме {2} {3} км/с. Чему равен показатель преломления стекла?":"Шыныдағы жарық жылдамдығы {0} {1} км/с, ал вакуумда {2} {3} км/с. Шынының сыну көрсеткіші неге тең?","Как меняется направление луча при переходе из воздуха в воду?":"Ауадан суға өткенде сәуленің бағыты қалай өзгереді?","Луч приближается к перпендикуляру":"Сәуле перпендикулярға жақындайды","Луч удаляется от перпендикуляра":"Сәуле перпендикулярдан алыстайды","Луч не меняет направления":"Сәуле бағытын өзгертпейді","Луч полностью отражается":"Сәуле толық шағылады","Вода оптически плотнее воздуха, поэтому угол преломления меньше угла падения.":"Су ауаға қарағанда оптикалық тығызырақ, сондықтан сыну бұрышы түсу бұрышынан кіші.","Фокусное расстояние линзы {0} м. Чему равна её оптическая сила?":"Линзаның фокус аралығы {0} м. Оның оптикалық күші неге тең?","{0} дптр":"{0} дптр","дптр":"дптр","D={0}/F={1}/{2}={3} диоптрии.":"D={0}/F={1}/{2}={3} диоптрия.","Предмет стоит в {0} см от собирающей линзы с фокусным расстоянием {1} см. На каком расстоянии от линзы получится изображение?":"Зат фокус аралығы {1} см жинағыш линзадан {0} см қашықтықта тұр. Кескін линзадан қандай қашықтықта шығады?","{0} см":"{0} см","см":"см","{0}/f={1}/F{2}/d={3}/{4}{5}/{6}={7}/{8}, значит f={9} см.":"{0}/f={1}/F{2}/d={3}/{4}{5}/{6}={7}/{8}, демек f={9} см.","Почему ложка в стакане с водой кажется «сломанной»?":"Неліктен су құйылған стакандағы қасық «сынған» болып көрінеді?","Из-за преломления света на границе воды и воздуха":"Су мен ауаның шекарасында жарықтың сынуынан","Из-за отражения света от стекла":"Жарықтың шыныдан шағылуынан","Потому что вода увеличивает предметы":"Өйткені су заттарды үлкейтеді","Из-за того, что вода окрашивает свет":"Су жарықты бояйтындықтан","Лучи от погружённой части преломляются на поверхности воды и приходят к глазу под другим углом.":"Батып тұрған бөліктен шыққан сәулелер су бетінде сынып, көзге басқа бұрышпен келеді.","Сколько протонов в ядре атома углерода{0} (массовое число {1}, зарядовое число {2})?":"Көміртек{0} атомының ядросында неше протон бар (массалық саны {1}, зарядтық саны {2})?","Зарядовое число Z равно числу протонов: {0}.":"Зарядтық сан Z протондар санына тең: {0}.","Сколько нейтронов в ядре углерода{0} (A={1}, Z={2})?":"Көміртек{0} ядросында неше нейтрон бар (A={1}, Z={2})?","Период полураспада вещества {0} дней. Какая часть радиоактивных ядер останется через {1} дней?":"Заттың жартылай ыдырау периоды {0} күн. {1} күннен кейін радиоактивті ядролардың қандай бөлігі қалады?","{0} дней — это два периода: ½·½=¼.":"{0} күн — бұл екі период: ½·½=¼.","дней — это два периода: ½·½=¼.":"күн — бұл екі период: ½·½=¼.","Как изменится энергия фотона, если частоту света увеличить в {0} раза?":"Жарықтың жиілігін {0} есе арттырса, фотонның энергиясы қалай өзгереді?","E=hν: энергия фотона прямо пропорциональна частоте.":"E=hν: фотонның энергиясы жиілікке тура пропорционал.","Фотоны какого света несут больше энергии — красного или фиолетового?":"Қай жарықтың фотондары көбірек энергия тасиды — қызыл ма, күлгін бе?","Фиолетового":"Күлгін","Красного":"Қызыл","Одинаковую энергию":"Энергиясы бірдей","Зависит от яркости":"Жарықтығына байланысты","У фиолетового света частота больше, а E=hν.":"Күлгін жарықтың жиілігі үлкенірек, ал E=hν.","Что называют фотоэффектом?":"Фотоэффект деп нені атайды?","Вырывание электронов из вещества под действием света":"Жарықтың әсерінен заттан электрондардың ұшып шығуын","Свечение вещества при нагревании":"Қыздырғанда заттың жарқырауын","Отражение света от металла":"Жарықтың металдан шағылуын","Распад ядер под действием света":"Жарықтың әсерінен ядролардың ыдырауын","Фотон отдаёт энергию электрону и выбивает его из металла.":"Фотон энергиясын электронға беріп, оны металдан ұшырып шығарады.","Горизонтальный бросок":"Горизонталь лақтыру","Тело участвует сразу в двух движениях: по горизонтали летит равномерно со скоростью v₀, а по вертикали падает, как при свободном падении. Время полёта t=√({0}h/g) зависит только от высоты, дальность L=v₀·t.":"Дене бір мезгілде екі қозғалысқа қатысады: горизонталь бойымен v₀ жылдамдықпен бірқалыпты ұшады, ал вертикаль бойымен еркін түскендегідей құлайды. Ұшу уақыты t=√({0}h/g) тек биіктікке тәуелді, ұшу қашықтығы L=v₀·t.","Бросок под углом к горизонту":"Горизонтқа бұрыш жасай лақтыру","Разложим начальную скорость на проекции: vx=v₀·cosα, vy=v₀·sinα. По горизонтали скорость не меняется, по вертикали каждую секунду уменьшается на g. Время полёта t={0}v₀·sinα/g, дальность L=v₀²·sin{1}α/g, высота H=v₀²·sin²α/({2}g). Дальше всего летит бросок под {3}°.":"Бастапқы жылдамдықты проекцияларға жіктейміз: vx=v₀·cosα, vy=v₀·sinα. Горизонталь бойымен жылдамдық өзгермейді, вертикаль бойымен әр секунд сайын g-ге азаяды. Ұшу уақыты t={0}v₀·sinα/g, қашықтығы L=v₀²·sin{1}α/g, биіктігі H=v₀²·sin²α/({2}g). Ең алысқа {3}°-пен лақтырылған дене ұшады.","Проекции силы и сложение сил":"Күштің проекциялары және күштерді қосу","Силу под углом раскладываем на две проекции: Fx=F·cosα и Fy=F·sinα. Две перпендикулярные силы складываем по теореме Пифагора. Ускорение вдоль пола создаёт только проекция на направление движения.":"Бұрыш жасай әсер ететін күшті екі проекцияға жіктейміз: Fx=F·cosα және Fy=F·sinα. Екі перпендикуляр күшті Пифагор теоремасы бойынша қосамыз. Еден бойымен үдеуді тек қозғалыс бағытына түсірілген проекция тудырады.","Наклонная плоскость и трение":"Көлбеу жазықтық және үйкеліс","На склоне сила тяжести раскладывается на mg·sinα (скатывает тело вдоль склона) и mg·cosα (прижимает к склону). Сила реакции N=mg·cosα, сила трения Fтр=μN. Без трения тело скатывается с ускорением a=g·sinα.":"Көлбеуде ауырлық күші mg·sinα (денені көлбеу бойымен сырғытады) және mg·cosα (көлбеуге басады) құраушыларына жіктеледі. Тіректің реакция күші N=mg·cosα, үйкеліс күші Fүйк=μN. Үйкеліс болмаса, дене a=g·sinα үдеумен сырғанайды.","Период, частота и скорость":"Период, жиілік және жылдамдық","T — время одного оборота, ν={0}/T — число оборотов в секунду. За один оборот точка проходит длину окружности {1}πR, поэтому v={2}πR/T. Угловая скорость ω={3}π/T связана с линейной: v=ωR.":"T — бір айналым уақыты, ν={0}/T — бір секундтағы айналым саны. Бір айналымда нүкте шеңбер ұзындығын {1}πR жүріп өтеді, сондықтан v={2}πR/T. Бұрыштық жылдамдық ω={3}π/T сызықтық жылдамдықпен байланысты: v=ωR.","Центростремительное ускорение":"Центрге тартқыш үдеу","Скорость по величине постоянна, но всё время поворачивает — значит, есть ускорение. Оно направлено к центру и равно aц=v²/R. Его создаёт какая-то сила: натяжение нити, трение шин о дорогу, притяжение Земли.":"Жылдамдықтың шамасы тұрақты, бірақ ол үнемі бұрылады — демек, үдеу бар. Ол центрге бағытталған және aц=v²/R-ге тең. Оны қандай да бір күш тудырады: жіптің керілуі, дөңгелектің жолмен үйкелісі, Жердің тартылысы.","Закон всемирного тяготения":"Бүкіләлемдік тартылыс заңы","Любые два тела притягиваются с силой F=G·m₁m₂/r². Сила растёт вместе с массами и быстро убывает с расстоянием: вдвое дальше — в {0} раза слабее. Сила тяжести mg — частный случай этого закона: g=GM/R².":"Кез келген екі дене F=G·m₁m₂/r² күшпен тартылады. Күш массалармен бірге артады және қашықтық артқанда тез кемиді: екі есе алыс — {0} есе әлсіз. Ауырлық күші mg — осы заңның дербес жағдайы: g=GM/R².","Спутники и невесомость":"Серіктер және салмақсыздық","Если запустить тело горизонтально с первой космической скоростью ≈{0} км/с, оно будет падать «вокруг» Земли и никогда не упадёт — станет спутником. Всё на орбите падает вместе, поэтому возникает невесомость.":"Денені горизонталь бағытта бірінші ғарыштық жылдамдықпен ≈{0} км/с ұшырса, ол Жерді «айнала» құлай береді, бірақ ешқашан жерге түспейді — серікке айналады. Орбитадағының бәрі бірге құлайды, сондықтан салмақсыздық пайда болады.","Давление твёрдых тел и жидкостей":"Қатты денелер мен сұйықтардың қысымы","Давление p=F/S показывает, какая сила приходится на {0} м² поверхности. В жидкости давление растёт с глубиной: p=ρgh. Единица давления — паскаль: {1} Па={2} Н/м².":"Қысым p=F/S бетінің {0} м²-не қандай күш келетінін көрсетеді. Сұйықта қысым тереңдік артқан сайын өседі: p=ρgh. Қысым бірлігі — паскаль: {1} Па={2} Н/м².","Закон Архимеда и плавание тел":"Архимед заңы және денелердің жүзуі","Жидкость давит на тело снизу сильнее, чем сверху, и выталкивает его силой Fа=ρж·g·Vт. Тело плавает, если Fа=mg, и тонет, если сила тяжести больше выталкивающей.":"Сұйық денеге төменнен жоғарыдан гөрі күштірек қысым түсіреді және оны Fа=ρс·g·Vд күшпен кері итереді. Fа=mg болса, дене жүзеді, ал ауырлық күші кері итеруші күштен үлкен болса, батады.","Отражение и преломление света":"Жарықтың шағылуы және сынуы","Угол отражения равен углу падения. На границе двух сред свет преломляется: показатель преломления n=c/v показывает, во сколько раз в среде свет медленнее, чем в вакууме. Переходя в более плотную среду, луч прижимается к перпендикуляру.":"Шағылу бұрышы түсу бұрышына тең. Екі ортаның шекарасында жарық сынады: сыну көрсеткіші n=c/v ортада жарықтың вакуумдағыдан неше есе баяу екенін көрсетеді. Тығызырақ ортаға өткенде сәуле перпендикулярға жақындайды.","Линзы":"Линзалар","Собирающая линза сводит параллельные лучи в фокусе F. Оптическая сила D={0}/F измеряется в диоптриях (F — в метрах). Формула линзы: {1}/F={2}/d+{3}/f, где d — расстояние до предмета, f — до изображения.":"Жинағыш линза параллель сәулелерді F фокуста жинайды. Оптикалық күш D={0}/F диоптриямен өлшенеді (F — метрмен). Линза формуласы: {1}/F={2}/d+{3}/f, мұндағы d — затқа дейінгі, f — кескінге дейінгі қашықтық.","Строение атома и ядра":"Атом мен ядроның құрылысы","Атом — это маленькое положительное ядро и электроны вокруг него. Ядро с массовым числом A и зарядовым числом Z содержит Z протонов и N=A−Z нейтронов. За период полураспада T½ распадается половина радиоактивных ядер.":"Атом — кішкентай оң ядро және оның айналасындағы электрондар. Массалық саны A, зарядтық саны Z ядрода Z протон және N=A−Z нейтрон бар. Жартылай ыдырау периоды T½ ішінде радиоактивті ядролардың жартысы ыдырайды.","Фотоны и фотоэффект":"Фотондар және фотоэффект","Свет излучается и поглощается порциями — фотонами с энергией E=hν. Чем больше частота (короче длина волны), тем больше энергия фотона. Фотоэффект — свет выбивает электроны из металла, если энергии фотона хватает.":"Жарық үлестермен — энергиясы E=hν фотондармен шығарылады және жұтылады. Жиілік неғұрлым үлкен (толқын ұзындығы қысқа) болса, фотонның энергиясы соғұрлым үлкен. Фотоэффект — фотонның энергиясы жеткілікті болса, жарық металдан электрондарды ұшырып шығарады.","Операции с векторами":"Векторларға амалдар","Вектор задаётся координатами (x;y). Складывая векторы, складываем координаты: ({0};{1})+({2};{3})=({4};{5}). Вычитание — так же. Длина вектора — по теореме Пифагора: √(x²+y²).":"Вектор (x;y) координаттарымен беріледі. Векторларды қосқанда координаттарын қосамыз: ({0};{1})+({2};{3})=({4};{5}). Азайту да солай. Вектордың ұзындығы — Пифагор теоремасы бойынша: √(x²+y²).","Умножение на число и перемещения":"Санға көбейту және орын ауыстырулар","При умножении на число k каждая координата умножается на k: {0}·({1};{2})=({3};{4}). Перемещение за несколько шагов — это сумма векторов всех шагов.":"k санына көбейткенде әр координат k-ға көбейтіледі: {0}·({1};{2})=({3};{4}). Бірнеше қадамдағы орын ауыстыру — барлық қадамдар векторларының қосындысы.","Равномерное движение":"Бірқалыпты қозғалыс","Скорость постоянна: s=v·t. Перевод: км/ч делим на {0} и получаем м/с. Пример: {1} км/ч = {2} м/с.":"Жылдамдық тұрақты: s=v·t. Айналдыру: км/сағ-ты {0}-ға бөлсек, м/с шығады. Мысал: {1} км/сағ = {2} м/с.","Равноускоренное движение":"Бірқалыпты үдемелі қозғалыс","Скорость растёт на a каждую секунду: v=a·t, путь s=at²/{0} (старт с покоя). Пример: a={1}, t={2} → v={3} м/с, s={4} м.":"Жылдамдық әр секунд сайын a-ға артады: v=a·t, жол s=at²/{0} (тыныштық күйден бастағанда). Мысал: a={1}, t={2} → v={3} м/с, s={4} м.","Свободное падение":"Еркін түсу","Это движение с ускорением g≈{0} м/с²: h=gt²/{1}, v=gt, v=√({2}gh). Масса тела на время падения не влияет.":"Бұл g≈{0} м/с² үдеумен қозғалыс: h=gt²/{1}, v=gt, v=√({2}gh). Дененің массасы құлау уақытына әсер етпейді.","Второй закон Ньютона":"Ньютонның екінші заңы","Ускорение прямо пропорционально силе и обратно пропорционально массе: a=F/m. Единица силы — ньютон: {0} Н={1} кг·м/с². Сила тяжести F=mg.":"Үдеу күшке тура пропорционал және массаға кері пропорционал: a=F/m. Күштің бірлігі — ньютон: {0} Н={1} кг·м/с². Ауырлық күші F=mg.","Третий закон и силы в задачах":"Үшінші заң және есептердегі күштер","Силы взаимодействия равны по модулю и противоположны, но приложены к разным телам. В задачах ищем равнодействующую: ma=F−Fтр; лифт: T−mg=ma.":"Өзара әсер күштері модулі бойынша тең және қарама-қарсы бағытталған, бірақ әртүрлі денелерге түсірілген. Есептерде тең әсерлі күшті табамыз: ma=F−Fүйк; лифт: T−mg=ma.","Работа и мощность":"Жұмыс және қуат","Работа A=F·s (сила вдоль перемещения) измеряется в джоулях. Мощность P=A/t — работа за секунду, в ваттах. Пример: поднять {0} кг на {1} м — A={2}·{3}·{4}={5} Дж.":"Жұмыс A=F·s (орын ауыстыру бойымен бағытталған күш) джоульмен өлшенеді. Қуат P=A/t — бір секундтағы жұмыс, ваттпен. Мысал: {0} кг-ды {1} м-ге көтеру — A={2}·{3}·{4}={5} Дж.","Кинетическая и потенциальная энергия":"Кинетикалық және потенциалдық энергия","Eк=mv²/{0} — энергия движения, Eп=mgh — энергия высоты, Eп=kx²/{1} — энергия пружины. Скорость вдвое больше — Eк в {2} раза больше.":"Eк=mv²/{0} — қозғалыс энергиясы, Eп=mgh — биіктік энергиясы, Eп=kx²/{1} — серіппе энергиясы. Жылдамдық екі есе артса — Eк {2} есе артады.","Закон сохранения энергии: горки и падение":"Энергияның сақталу заңы: төбешіктер және құлау","Без трения Eк+Eп=const: потенциальная энергия на горке превращается в кинетическую. Отсюда v=√({0}gh), масса не нужна. С трением часть энергии уходит в тепло.":"Үйкеліс болмаса Eк+Eп=const: төбешіктегі потенциалдық энергия кинетикалық энергияға айналады. Бұдан v=√({0}gh), масса қажет емес. Үйкеліс болса, энергияның бір бөлігі жылуға кетеді.","Импульс и закон его сохранения":"Импульс және оның сақталу заңы","Импульс p=m·v, единица кг·м/с. Теорема об импульсе: F·Δt=Δp. В замкнутой системе суммарный импульс до и после взаимодействия одинаков (выстрел, отдача).":"Импульс p=m·v, бірлігі кг·м/с. Импульс туралы теорема: F·Δt=Δp. Тұйық жүйеде өзара әрекеттесуге дейінгі және кейінгі қосынды импульс бірдей (ату, кері тебу).","Неупругое столкновение (тела слипаются)":"Серпімсіз соқтығыс (денелер жабысады)","Тела движутся дальше вместе: m₁v₁+m₂v₂=(m₁+m₂)·v. Импульс сохраняется, а часть механической энергии уходит в тепло и деформацию.":"Денелер ары қарай бірге қозғалады: m₁v₁+m₂v₂=(m₁+m₂)·v. Импульс сақталады, ал механикалық энергияның бір бөлігі жылу мен деформацияға кетеді.","Упругое столкновение":"Серпімді соқтығыс","Сохраняются и импульс, и энергия. Для равных масс тела обмениваются скоростями. Если второе тело покоилось: v₁′=(m₁−m₂)v/(m₁+m₂), v₂′={0}m₁v/(m₁+m₂).":"Импульс те, энергия да сақталады. Массалары тең болса, денелер жылдамдықтарымен алмасады. Екінші дене тыныштықта болса: v₁′=(m₁−m₂)v/(m₁+m₂), v₂′={0}m₁v/(m₁+m₂).","Период и частота":"Период және жиілік","T — время одного колебания, ν={0}/T — число колебаний в секунду (Гц). Если за время t было N колебаний, то T=t/N.":"T — бір тербеліс уақыты, ν={0}/T — бір секундтағы тербеліс саны (Гц). t уақытта N тербеліс болса, T=t/N.","Маятник и пружина":"Маятник және серіппе","Математический маятник: T={0}π√(l/g), от массы не зависит. Длина в {1} раза больше — период в {2} раза обе координаты, а не одну. Отрицательное число разворачивает вектор. Если перемещения за равные промежутки времени одинаковы, просто умножьте на число промежутков.":"Санға көбейту бір координатты емес, екеуін де өзгертеді. Теріс сан векторды кері бұрады. Тең уақыт аралықтарындағы орын ауыстырулар бірдей болса, аралықтар санына көбейте салыңыз.","Следите за единицами: км/ч → м/с делим на {0}, а м/с → км/ч умножаем. Скорость — отношение пути ко времени, а не наоборот.":"Бірліктерді қадағалаңыз: км/сағ → м/с үшін {0}-ға бөлеміз, ал м/с → км/сағ үшін көбейтеміз. Жылдамдық — жолдың уақытқа қатынасы, керісінше емес.","Путь при равноускоренном движении растёт как квадрат времени: за вдвое большее время путь в {0} раза больше, а скорость — только вдвое.":"Бірқалыпты үдемелі қозғалыста жол уақыттың квадратындай өседі: уақыт екі есе көп болса, жол {0} есе көп, ал жылдамдық — тек екі есе.","Ускорение измеряется в м/с², а не в м/с. Масса — в килограммах (не в граммах!). Сила — вектор: важно, куда она направлена.":"Үдеу м/с-пен емес, м/с²-пен өлшенеді. Масса — килограммен (граммен емес!). Күш — вектор: оның қайда бағытталғаны маңызды.","Силы третьего закона приложены к разным телам и не уравновешивают друг друга. Для движения нужна равнодействующая: сложите силы вдоль оси движения.":"Үшінші заңның күштері әртүрлі денелерге түсірілген және бірін-бірі теңгермейді. Қозғалыс үшін тең әсерлі күш керек: күштерді қозғалыс осі бойымен қосыңыз.","Работу даёт только составляющая силы вдоль перемещения: если сила перпендикулярна движению, работа равна нулю. Мощность — работа за единицу времени.":"Жұмысты күштің тек орын ауыстыру бойымен бағытталған құраушысы береді: күш қозғалысқа перпендикуляр болса, жұмыс нөлге тең. Қуат — уақыт бірлігіндегі жұмыс.","Eк зависит от v², поэтому ошибка в скорости даёт большую ошибку в энергии. Высоту отсчитывайте от выбранного нуля потенциальной энергии.":"Eк v²-қа тәуелді, сондықтан жылдамдықтағы қате энергияда үлкен қате береді. Биіктікті потенциалдық энергияның таңдалған нөлінен бастап есептеңіз.","Импульс — вектор: направление важно. Орудие до выстрела покоится, суммарный импульс равен нулю — значит, снаряд и орудие движутся в разные стороны. Единица кг·м/с равна Н·с.":"Импульс — вектор: бағыты маңызды. Атылғанға дейін зеңбірек тыныштықта, қосынды импульс нөлге тең — демек, снаряд пен зеңбірек қарама-қарсы жаққа қозғалады. кг·м/с бірлігі Н·с-қа тең.","При неупругом ударе энергия НЕ сохраняется (часть уходит в тепло), но импульс сохраняется всегда. В знаменателе — сумма масс.":"Серпімсіз соқтығыста энергия сақталМАЙДЫ (бір бөлігі жылуға кетеді), бірақ импульс әрқашан сақталады. Бөлімде — массалардың қосындысы.","Если массы равны, а второе тело стоит, тела обмениваются скоростями. Лёгкий шар, ударивший тяжёлый, отскакивает назад. Проверяйте ответ: суммарный импульс до и после должен совпасть.":"Массалар тең болып, екінші дене тұрса, денелер жылдамдықтарымен алмасады. Ауыр шарды соққан жеңіл шар кері секіреді. Жауапты тексеріңіз: соқтығысқа дейінгі және кейінгі қосынды импульс сәйкес келуі тиіс.","Период измеряется в секундах, частота — в герцах; они взаимно обратны: ν={0}/T. Если за время t было N колебаний, то T=t/N, а не N/t.":"Период секундпен, жиілік герцпен өлшенеді; олар өзара кері: ν={0}/T. t уақытта N тербеліс болса, T=t/N, N/t емес.","Период маятника зависит от длины и g, но не от массы. Корень «сглаживает»: длина в {0} раза больше — период в {1} раза.":"Маятниктің периоды ұзындық пен g-ге тәуелді, бірақ массаға тәуелді емес. Түбір «жұмсартады»: ұзындық {0} есе артса — период {1} есе артады.","Закон Ома — для участка цепи: ток растёт с напряжением и падает с сопротивлением. Не путайте U=I·R и R=U/I.":"Ом заңы — тізбек бөлігі үшін: ток кернеумен бірге артады және кедергі артқанда азаяды. U=I·R мен R=U/I-ді шатастырмаңыз.","Последовательно: ток один, сопротивления складываются. Параллельно: напряжение одно, общее сопротивление меньше самого малого. Два одинаковых — R/{0}.":"Тізбектей: ток бірдей, кедергілер қ ,"Инфракрасный":"Инфрақызыл","Зелёный":"Жасыл","\"Одинаково\"":"\"Бірдей\"","Одинаково":"Бірдей","\"Зависит от яркости\"":"\"Жарықтығына байланысты\"","Главная идея — независимость движений: время полёта определяется только вертикалью. Мяч, брошенный горизонтально, и мяч, просто отпущенный с той же высоты, упадут одновременно.":"Басты идея — қозғалыстардың тәуелсіздігі: ұшу уақыты тек вертикальмен анықталады. Горизонталь лақтырылған доп пен сол биіктіктен жай жіберілген доп жерге бір мезгілде түседі.","Не путайте sin и cos: vx=v₀·cosα (прилежащий катет), vy=v₀·sinα. В верхней точке vy={0}, но vx остаётся — скорость там не равна нулю!":"sin мен cos-ты шатастырмаңыз: vx=v₀·cosα (іргелес катет), vy=v₀·sinα. Жоғарғы нүктеде vy={0}, бірақ vx сақталады — онда жылдамдық нөлге тең емес!","Угол обычно отсчитывают от горизонта, тогда горизонтальная проекция — через косинус. Если угол дан от вертикали, синус и косинус меняются местами — всегда смотрите на рисунок.":"Бұрышты әдетте горизонттан есептейді, сонда горизонталь проекция косинус арқылы табылады. Бұрыш вертикальдан берілсе, синус пен косинус орын ауыстырады — әрқашан суретке қараңыз.","Частая ошибка — считать N=mg на наклоне. На склоне тело прижимается слабее: N=mg·cosα. Трение считайте через N, а не через mg.":"Жиі кездесетін қате — көлбеуде N=mg деп есептеу. Көлбеуде дене әлсізірек басылады: N=mg·cosα. Үйкелісті mg арқылы емес, N арқылы есептеңіз.","Не путайте период и частоту: T — в секундах, ν — в герцах, ν={0}/T. Если дано «N оборотов за t секунд», то T=t/N.":"Период пен жиілікті шатастырмаңыз: T — секундпен, ν — герцпен, ν={0}/T. «t секундта N айналым» берілсе, T=t/N.","Центростремительное ускорение направлено к центру, а не наружу. «Центробежная сила», которую мы ощущаем в автобусе на повороте, — это инерция: тело стремится двигаться прямо.":"Центрге тартқыш үдеу сыртқа емес, центрге бағытталған. Автобус бұрылғанда сезілетін «центрден тепкіш күш» — бұл инерция: дене түзу қозғалуға ұмтылады.","Расстояние r считают между центрами тел. Для тела у поверхности планеты r — это её радиус, а не высота над землёй.":"r қашықтығы денелердің центрлерінің арасында есептеледі. Планета бетіндегі дене үшін r — жерден биіктік емес, планетаның радиусы.","Невесомость — не отсутствие притяжения! На высоте МКС (около {0} км) притяжение слабее земного лишь примерно на {1}%. Невесомость возникает, потому что станция и всё в ней свободно падают.":"Салмақсыздық — тартылыстың жоқтығы емес! ХҒС биіктігінде (шамамен {0} км) тартылыс жердегіден тек шамамен {1}%-ға әлсіз. Салмақсыздық станция мен ондағының бәрі еркін түскендіктен пайда болады.","Площадь переводите в м²: {0} см² = {1} м². Давление жидкости зависит от глубины, а не от формы сосуда.":"Ауданды м²-ге айналдырыңыз: {0} см² = {1} м². Сұйықтың қысымы ыдыстың пішініне емес, тереңдікке тәуелді.","Сила Архимеда зависит от объёма погружённой части и плотности ЖИДКОСТИ, а не тела. Тяжёлый и лёгкий шары одинакового объёма выталкиваются одинаково.":"Архимед күші батқан бөліктің көлеміне және дененің емес, СҰЙЫҚТЫҢ тығыздығына тәуелді. Көлемі бірдей ауыр және жеңіл шарлар бірдей күшпен итеріледі.","Углы падения, отражения и преломления отсчитывают от перпендикуляра к поверхности, а не от самой поверхности. Это самая частая ловушка.":"Түсу, шағылу және сыну бұрыштары беттің өзінен емес, бетке түсірілген перпендикулярдан есептеледі. Бұл ең жиі кездесетін тұзақ.","В формуле D={0}/F фокусное расстояние — обязательно в метрах: {1} см = {2} м, значит D={3} дптр.":"D={0}/F формуласында фокус аралығы міндетті түрде метрмен: {1} см = {2} м, демек D={3} дптр.","Массовое число A — это все нуклоны (протоны + нейтроны), зарядовое Z — только протоны. Нейтроны: N=A−Z. В нейтральном атоме электронов столько же, сколько протонов.":"Массалық сан A — барлық нуклондар (протондар + нейтрондар), зарядтық сан Z — тек протондар. Нейтрондар: N=A−Z. Бейтарап атомда электрондар саны протондар санына тең.","Яркость света — это количество фотонов, а энергия одного фотона зависит vec:[['Даны векторы a=(2;5) и b=(1;−3). Найдите их сумму a+b.','(3;2)~(1;8)~(3;8)~(1;−2)','Складываем отдельно x-координаты: 2+1=3, и отдельно y-координаты: 5+(−3)=2.'],['Даны векторы a=(5;7) и b=(2;3). Найдите их разность a−b.','(3;4)~(7;10)~(3;10)~(−3;−4)','Вычитаем координаты по отдельности: x: 5−2=3, y: 7−3=4.'],['Вектор a имеет координаты (3;4). Чему равна его длина?','5~7~12~25','Длина вектора = √(x²+y²) = √(9+16) = √25 = 5.'],['Даны векторы a=(2;−1) и b=(1;3). Найдите вектор 2a+b.','(5;1)~(4;2)~(3;2)~(5;5)','Сначала 2a=(4;−2), затем прибавляем b: (4+1; −2+3)=(5;1).'],['Дрон пролетел сначала на (3;4) км, а затем на (−3;−1) км. Каково его итоговое перемещение и чему равна его длина?','(0;3), длина 3 км~(6;5), длина 8 км~(0;5), длина 5 км~(0;3), длина 5 км','Складываем перемещения: (3−3; 4−1)=(0;3). Длина √(0²+3²)=3 км.'],['Дан вектор a=(4;−2). Найдите вектор 3a, то есть умножьте вектор на число 3.','(12;−6)~(7;1)~(12;6)~(1;−5)','При умножении на число умножаем каждую координату: 3·4=12 и 3·(−2)=−6.'],['Вектор a имеет координаты (6;8). Найдите его длину.','10~14~48~100','Длина = √(6²+8²) = √(36+64) = √100 = 10.']],
eq:[['Решите квадратное уравнение x²−5x+6=0. Какие у него корни?','2 и 3~1 и 6~−2 и −3~−2 и 3','По теореме Виета ищем два числа: их сумма 5, а произведение 6. Это 2 и 3.'],['Чему равен дискриминант уравнения x²−4x+3=0?','4~16~7~−4','D=b²−4ac. Здесь a=1, b=−4, c=3, значит D=16−12=4.'],['Решите квадратное уравнение x²−x−6=0.','3 и −2~−3 и 2~6 и −1~3 и 2','Ищем два числа: сумма 1, произведение −6. Подходят 3 и −2.'],['Сколько действительных корней у уравнения x²+4=0?','Нет корней~Два: 2 и −2~Один: x=2~Один: x=−4','x²=−4, но квадрат числа не бывает отрицательным. Дискриминант D=−16<0.'],['Длина прямоугольного участка на 2 м больше ширины, а площадь равна 15 м². Найдите ширину участка.','3 м~5 м~−5 м~7,5 м','Пусть ширина x, тогда x(x+2)=15, то есть x²+2x−15=0. Корни 3 и −5, но ширина не бывает отрицательной.'],['Решите квадратное уравнение x²−6x+9=0.','x=3 (один корень)~x=3 и x=−3~x=6 и x=3~Нет корней','D=36−36=0, значит корень один: x=−b/(2a)=6/2=3.'],['При каком значении c уравнение x²+4x+c=0 имеет ровно один корень?','4~16~−4~2','Один корень бывает, когда D=0: 16−4c=0, откуда c=4.']],
func:[['Функция задана формулой f(x)=2x+1. Чему равно f(3)?','7~6~9~5','Подставляем x=3 в формулу: 2·3+1=7.'],['В какой точке прямая y=2x−4 пересекает ось Ox (горизонтальную ось)?','(2;0)~(0;−4)~(4;0)~(0;2)','На оси Ox значение y равно 0: 2x−4=0, значит x=2.'],['Найдите координаты вершины параболы y=x²−4x+3.','(2;−1)~(−2;−1)~(2;1)~(4;3)','x₀=−b/(2a)=4/2=2. Подставляем: y=4−8+3=−1.'],['Как выглядит график функции y=−x²+4: куда направлены ветви параболы и где её вершина?','Ветви вниз, вершина (0;4)~Ветви вверх, вершина (0;4)~Ветви вниз, вершина (4;0)~Ветви вверх, вершина (0;−4)','Минус перед x² разворачивает ветви вниз, а +4 поднимает вершину до точки (0;4).'],['Такси берёт 200 ₸ за посадку и 100 ₸ за каждый километр, то есть цена f(x)=100x+200. Сколько стоит поездка на 5 км?','700 ₸~500 ₸~1000 ₸~300 ₸','Подставляем x=5: 100·5+200=700 ₸.'],['Куда направлены ветви параболы y=2x²−3x+1?','Вверх, потому что a=2>0~Вниз, потому что b=−3<0~Вниз, потому что c=1>0~Вправо, потому что a=2','Направление ветвей определяет только знак числа перед x²: a=2>0, значит вверх.'],['Найдите нули функции y=x²−9, то есть значения x, при которых y=0.','−3 и 3~9~3~0','x²−9=0, значит x²=9, а это x=3 или x=−3.']],
der:[['Найдите производную функции f(x)=x³.','3x²~x²~3x~x⁴/4','Правило (xⁿ)′=n·xⁿ⁻¹: показатель 3 выходит вперёд, а степень уменьшается на 1.'],['Найдите производную функции f(x)=3x²+5x.','6x+5~3x+5~6x²+5~6x','Берём производную каждого слагаемого: (3x²)′=6x, (5x)′=5.'],['Дана функция f(x)=x³−2x+1. Найдите значение её производной в точке x=2, то есть f′(2).','10~12~8~5','f′(x)=3x²−2. Подставляем x=2: 3·4−2=10.'],['При каком x функция f(x)=x²−6x принимает наименьшее значение?','x=3~x=−3~x=6~x=0','В точке минимума производная равна нулю: f′(x)=2x−6=0, откуда x=3.'],['Тело движется по закону s(t)=t³−3t (s — в метрах, t — в секундах). Какова его скорость в момент t=2 с (в м/с)?','9~6~3~12','Скорость — это производная пути: v=3t²−3. При t=2: 12−3=9 м/с.'],['Найдите производную функции f(x)=5x⁴−2x.','20x³−2~5x³−2~20x⁴−2~4x³','(5x⁴)′=5·4x³=20x³, а (2x)′=2.'],['Тело движется по закону s(t)=t²+2t (s — в метрах). Какова его скорость в момент t=3 с (в м/с)?','8~9~15~6','v=s′=2t+2. При t=3: 6+2=8 м/с.']],
int:[['Найдите неопределённый интеграл ∫2x dx.','x²+C~2x²+C~2+C~x+C','Ищем функцию, производная которой равна 2x: это x², плюс постоянная C.'],['Найдите неопределённый интеграл ∫(2x+3)dx.','x²+3x+C~2x²+3x+C~x²+3+C~2+3x+C','Интегрируем по частям суммы: ∫2x dx=x², ∫3 dx=3x.'],['Вычислите определённый интеграл функции x на отрезке от 0 до 2: ∫₀² x dx.','2~4~1~½','Первообразная x²/2. Считаем: 2²/2−0=2.'],['Вычислите определённый интеграл ∫₁³ 2x dx.','8~6~9~4','Первообразная x². Считаем: 3²−1²=9−1=8.'],['Скорость поезда меняется по закону v=2t+3 (м/с). Какой путь он прошёл за первые 2 секунды?','10 м~7 м~14 м~4 м','Путь — интеграл скорости: [t²+3t] от 0 до 2 = 4+6=10 м.'],['Найдите неопределённый интеграл ∫3x² dx.','x³+C~3x³+C~6x+C~x²+C','Степень увеличиваем на 1 и делим на новую степень: 3·x³/3=x³.'],['Тело движется с постоянной скоростью 4 м/с. Какой путь оно пройдёт за первые 3 секунды?','12 м~7 м~4 м~3 м','При постоянной скорости путь = скорость × время = 4·3=12 м.']],
kin:[['Велосипедист едет с постоянной скоростью 5 м/с в течение 8 секунд. Какой путь он проедет?','40 м~13 м~1,6 м~45 м','Путь = скорость × время: s=v·t=5·8=40 м.'],['Тело равномерно прошло 100 м за 20 секунд. С какой скоростью оно двигалось?','5 м/с~2000 м/с~0,2 м/с~20 м/с','Скорость = путь ÷ время: v=100/20=5 м/с.'],['Машина трогается с места с ускорением 2 м/с². Какой будет её скорость через 4 секунды?','8 м/с~6 м/с~2 м/с~16 м/с','Каждую секунду скорость растёт на 2 м/с: v=a·t=2·4=8 м/с.'],['Машина трогается с места с ускорением 2 м/с². Какой путь она проедет за 5 секунд?','25 м~10 м~50 м~12,5 м','При старте с места s=at²/2=2·25/2=25 м.'],['Камень бросили вертикально вверх со скоростью 20 м/с (g=10 м/с²). Через сколько секунд он достигнет самой высокой точки?','2 с~4 с~20 с~0,5 с','В верхней точке скорость равна 0. Каждую секунду она уменьшается на 10 м/с: 20/10=2 с.'],['Автомобиль равномерно разгоняется с места до 20 м/с за 10 секунд. Какой путь он проехал за это время?','100 м~200 м~20 м~50 м','Ускорение a=20/10=2 м/с², путь s=at²/2=2·100/2=100 м.'],['Поезд едет со скоростью 72 км/ч. Сколько это в метрах в секунду?','20 м/с~72 м/с~259 м/с~7,2 м/с','Чтобы перевести км/ч в м/с, делим на 3,6: 72/3,6=20 м/с.'],['Тело падает без начальной скорости с высоты 80 м (g=10 м/с²). Сколько секунд длится падение?','4 с~8 с~16 с~2 с','h=gt²/2, откуда t=√(2h/g)=√(160/10)=√16=4 с.'],['Тело падает без начальной скорости с высоты 45 м (g=10 м/с²). С какой скоростью оно ударится о землю?','30 м/с~45 м/с~90 м/с~15 м/с','v=√(2gh)=√(2·10·45)=√900=30 м/с.']],
new:[['На тело массой 2 кг действует сила 10 Н. С каким ускорением оно движется?','5 м/с²~20 м/с²~5 м/с~0,2 м/с²','Второй закон Ньютона: a=F/m=10/2=5. Ускорение измеряется в м/с².'],['В каких единицах измеряется сила?','В ньютонах (Н)~В джоулях (Дж)~В ваттах (Вт)~В паскалях (Па)','1 ньютон — это сила, которая разгоняет 1 кг с ускорением 1 м/с².'],['Чему равна сила тяжести, действующая на тело массой 4 кг? (g=10 м/с²)','40 Н~4 Н~0,4 Н~14 Н','Сила тяжести F=m·g=4·10=40 Н.'],['Силу, действующую на тело, увеличили в 2 раза, а масса тела не изменилась. Что произойдёт с ускорением?','Оно вырастет в 2 раза~Оно уменьшится в 2 раза~Оно не изменится~Оно вырастет в 4 раза','a=F/m: во сколько раз больше сила, во столько же раз больше ускорение.'],['Брусок массой 2 кг тянут по столу с силой 10 Н, а сила трения равна 4 Н. С каким ускорением движется брусок?','3 м/с²~5 м/с²~7 м/с²~2 м/с²','Трение мешает движению: равнодействующая 10−4=6 Н, a=6/2=3 м/с².'],['Лифт массой 500 кг поднимается вверх с ускорением 2 м/с² (g=10 м/с²). С какой силой натянут трос?','6000 Н~5000 Н~4000 Н~1000 Н','Трос должен и удержать лифт, и разогнать его: T=m(g+a)=500·12=6000 Н.'],['Тело массой 5 кг лежит на гладком столе без трения. Его тянут горизонтально с силой 20 Н. Какой путь оно пройдёт за 2 секунды, если сначала покоилось?','8 м~4 м~16 м~40 м','a=F/m=20/5=4 м/с², путь s=at²/2=4·4/2=8 м.'],['Земля притягивает яблоко с силой 2 Н. С какой силой яблоко притягивает Землю?','2 Н~0 Н~Намного меньше 2 Н~Намного больше 2 Н','Третий закон Ньютона: тела действуют друг на друга с равными по величине силами.']],
en:[['Сила 5 Н передвинула тело на 4 м в направлении силы. Какую работу она совершила?','20 Дж~9 Дж~1,25 Дж~0,8 Дж','Работа = сила × путь: A=F·s=5·4=20 Дж.'],['Тело массой 2 кг подняли на высоту 5 м. Какова его потенциальная энергия? (g=10 м/с²)','100 Дж~10 Дж~50 Дж~20 Дж','Eп=m·g·h=2·10·5=100 Дж.'],['Тело массой 2 кг движется со скоростью 3 м/с. Какова его кинетическая энергия?','9 Дж~6 Дж~18 Дж~3 Дж','Eк=mv²/2=2·9/2=9 Дж.'],['Скорость тела увеличилась в 2 раза. Как изменилась его кинетическая энергия?','Выросла в 4 раза~Выросла в 2 раза~Не изменилась~Выросла в 8 раз','В формуле Eк=mv²/2 скорость в квадрате: 2²=4.'],['Санки массой 20 кг скатываются без трения с горки высотой 5 м (g=10 м/с²). Какова их скорость у подножия горки?','10 м/с~5 м/с~20 м/с~50 м/с','Энергия высоты переходит в энергию движения: mgh=mv²/2, v=√(2gh)=√100=10 м/с. Масса сокращается.'],['Шарик массой 0,5 кг падает с высоты 20 м (g=10 м/с², сопротивления воздуха нет). Какова его кинетическая энергия у самой земли?','100 Дж~10 Дж~200 Дж~50 Дж','Вся потенциальная энергия переходит в кинетическую: Eк=mgh=0,5·10·20=100 Дж.'],['Мальчик массой 40 кг поднялся по лестнице на высоту 3 м за 6 секунд (g=10 м/с²). Какую мощность он развил?','200 Вт~1200 Вт~72 Вт~20 Вт','Работа A=mgh=1200 Дж. Мощность = работа ÷ время: 1200/6=200 Вт.'],['Тело массой 2 кг соскальзывает с горки высотой 5 м (g=10 м/с²) и у подножия имеет скорость 8 м/с. Сколько энергии ушло в тепло из-за трения?','36 Дж~64 Дж~100 Дж~164 Дж','Вверху Eп=mgh=100 Дж, внизу Eк=mv²/2=64 Дж. Разница 100−64=36 Дж ушла в тепло.'],['Пружину жёсткостью 200 Н/м сжали на 0,1 м. Какая энергия в ней запасена?','1 Дж~20 Дж~10 Дж~2 Дж','Энергия пружины Eп=kx²/2=200·0,01/2=1 Дж.'],['Груз массой 2 кг равномерно подняли на высоту 3 м (g=10 м/с²). Какую работу совершила поднимающая сила?','60 Дж~6 Дж~30 Дж~20 Дж','A=m·g·h=2·10·3=60 Дж.'],['Камень массой 0,2 кг бросили вверх со скоростью 10 м/с (g=10 м/с², сопротивления воздуха нет). На какую наибольшую высоту он поднимется?','5 м~10 м~2 м~1 м','Энергия движения внизу равна энергии высоты вверху: h=v²/(2g)=100/20=5 м.']],
imp:[['Тело массой 3 кг движется со скоростью 4 м/с. Чему равен его импульс?','12 кг·м/с~7 кг·м/с~0,75 кг·м/с~1 кг·м/с','Импульс = масса × скорость: p=m·v=3·4=12 кг·м/с.'],['Импульс тела равен 20 кг·м/с, а его масса 4 кг. С какой скоростью движется тело?','5 м/с~16 м/с~80 м/с~0,2 м/с','v=p/m=20/4=5 м/с.'],['В каких единицах измеряется импульс?','кг·м/с~Н·с²~Дж~Вт','Импульс p=m·v, поэтому его единица — килограмм, умноженный на метр в секунду.'],['Тележка массой 2 кг едет со скоростью 3 м/с и сцепляется с неподвижной тележкой массой 1 кг. С какой скоростью они поедут вместе?','2 м/с~3 м/с~1 м/с~4,5 м/с','Импульс до сцепки 2·3=6 кг·м/с. После: (2+1)·v=6, значит v=2 м/с.'],['Снаряд массой 2 кг вылетает из пушки массой 400 кг со скоростью 600 м/с. С какой скоростью откатится пушка?','3 м/с~1,2 м/с~300 м/с~0,33 м/с','До выстрела всё покоилось, импульс 0. Значит 2·600=400·v, v=3 м/с.'],['Шар массой 2 кг со скоростью 3 м/с упруго ударяет неподвижный шар такой же массы. Что произойдёт?','Первый остановится, второй поедет со скоростью 3 м/с~Оба поедут со скоростью 1,5 м/с~Первый отскочит назад, второй поедет со скоростью 3 м/с~Оба остановятся','При упругом ударе одинаковые шары обмениваются скоростями.'],['Два одинаковых шара по 1 кг летят навстречу друг другу: первый со скоростью 5 м/с, второй — 3 м/с. Удар упругий. Какими станут скорости (направление первого считаем положительным)?','1-й: −3 м/с, 2-й: 5 м/с~1-й: −5 м/с, 2-й: 3 м/с~Оба: 1 м/с~Оба остановятся','Одинаковые шары при упругом ударе меняются скоростями: v₁′=−3, v₂′=5. Проверка: 5−3 = −3+5.'],['Шар массой 1 кг со скоростью 4 м/с упруго ударяет неподвижный шар массой 3 кг. Какими станут их скорости?','1-й: −2 м/с, 2-й: 2 м/с~1-й: 1 м/с, 2-й: 1 м/с~1-й: 0, 2-й: 4/3 м/с~1-й: 2 м/с, 2-й: 2 м/с','v₁′=(m₁−m₂)v/(m₁+m₂)=−2, v₂′=2m₁v/(m₁+m₂)=2. Лёгкий шар отскакивает назад.'],['Мяч массой 0,5 кг летит со скоростью 4 м/с, ударяется о стену и останавливается за 0,1 секунды. С какой средней силой стена действовала на мяч?','20 Н~2 Н~0,2 Н~200 Н','Изменение импульса равно F·Δt: F=0,5·4/0,1=20 Н.'],['Пластилиновый шар массой 3 кг летит со скоростью 2 м/с и прилипает к неподвижному шару массой 1 кг. С какой скоростью они движутся вместе?','1,5 м/с~2 м/с~0,5 м/с~6 м/с','Импульс 3·2=6 делится на общую массу 4: v=1,5 м/с.'],['Вагон массой 20 т едет со скоростью 1 м/с и сцепляется с неподвижным вагоном массой 30 т. С какой скоростью поедет сцепка?','0,4 м/с~1 м/с~0,6 м/с~2,5 м/с','20·1=(20+30)·v, значит v=20/50=0,4 м/с.'],['Что происходит с механической энергией, когда тела сталкиваются и слипаются (неупругий удар)?','Часть переходит во внутреннюю энергию (нагрев, деформация)~Полностью сохраняется~Полностью исчезает~Увеличивается','Импульс сохраняется, а часть энергии уходит в нагрев и вмятины.'],['Чем упругий удар отличается от неупругого?','При упругом сохраняются и импульс, и механическая энергия~При упругом сохраняется только энергия~При упругом сохраняется только импульс~Никакой разницы нет','Импульс сохраняется всегда, а механическая энергия — только при упругом ударе.']],
osc:[['Маятник совершает одно полное колебание за 0,5 секунды (это период). Какова частота колебаний?','2 Гц~0,5 Гц~5 Гц~0,25 Гц','Частота — число колебаний в секунду: ν=1/T=1/0,5=2 Гц.'],['Маятник колеблется с частотой 5 Гц (5 колебаний в секунду). Чему равен период — время одного колебания?','0,2 с~5 с~0,5 с~2 с','T=1/ν=1/5=0,2 с.'],['Длину нити маятника увеличили в 4 раза. Как изменится период его колебаний?','Вырастет в 2 раза~Вырастет в 4 раза~Уменьшится в 2 раза~Не изменится','T=2π√(l/g): длина стоит под корнем, а √4=2.'],['Как период колебаний нитяного маятника зависит от массы груза?','Не зависит~Растёт с массой~Убывает с массой~Зависит только от размаха колебаний','В формуле T=2π√(l/g) массы нет.'],['Маятник за 20 секунд совершил 40 полных колебаний. Чему равен период?','0,5 с~2 с~20 с~0,25 с','Период = время ÷ число колебаний: T=20/40=0,5 с.'],['Груз массой 0,25 кг висит на пружине жёсткостью 100 Н/м. Чему примерно равен период его колебаний (π≈3,14)?','0,31 с~3,14 с~0,05 с~1 с','T=2π√(m/k)=2·3,14·√0,0025=2·3,14·0,05≈0,31 с.']],
tri:[['В прямоугольном треугольнике гипотенуза равна 10, а катет напротив угла α равен 6. Чему равен sin α?','0,6~0,8~1,67~0,4','sin α = противолежащий катет ÷ гипотенуза = 6/10 = 0,6.'],['Чему равен sin 30°?','1/2~√3/2~√2/2~1','Это табличное значение: sin 30° = 1/2.'],['Чему равен tg 45°?','1~0~√2/2~√3','tg 45° = sin 45° ÷ cos 45°, а они равны, поэтому tg 45° = 1.'],['Катеты прямоугольного треугольника равны 3 и 4. Чему равна гипотенуза?','5~7~12~25','По теореме Пифагора: √(3²+4²)=√25=5.'],['Известно, что sin α=0,6 и угол α острый. Найдите cos α.','0,8~0,4~1,6~0,36','cos²α=1−sin²α=1−0,36=0,64, значит cos α=0,8.'],['Чему равно sin²α+cos²α при любом угле α?','1~0~2~sin α','Это основное тригонометрическое тождество.'],['Лестница длиной 5 м приставлена к стене под углом 60° к земле (sin 60°≈0,87). На какой высоте находится её верхний конец?','≈4,3 м~≈2,5 м~≈5,8 м~≈8,7 м','Высота = длина × sin 60° ≈ 5·0,87 ≈ 4,3 м.']],
ele:[['Напряжение на участке цепи 12 В, сопротивление 4 Ом. Какая сила тока течёт по участку?','3 А~48 А~0,33 А~8 А','Закон Ома: I=U/R=12/4=3 А.'],['Сила тока в цепи 2 А, сопротивление 5 Ом. Чему равно напряжение?','10 В~2,5 В~7 В~0,4 В','U=I·R=2·5=10 В.'],['Как изменится сила тока, если напряжение увеличить в 2 раза, а сопротивление оставить прежним?','Вырастет в 2 раза~Уменьшится в 2 раза~Не изменится~Вырастет в 4 раза','I=U/R: ток растёт во столько же раз, во сколько растёт напряжение.'],['Лампа работает при напряжении 220 В, сила тока в ней 0,5 А. Какова мощность лампы?','110 Вт~440 Вт~220 Вт~0,0023 Вт','Мощность P=U·I=220·0,5=110 Вт.'],['Два резистора 3 Ом и 6 Ом соединены последовательно (друг за другом). Каково их общее сопротивление?','9 Ом~2 Ом~18 Ом~4,5 Ом','При последовательном соединении сопротивления складываются: 3+6=9 Ом.'],['Те же резисторы 3 Ом и 6 Ом соединили параллельно. Каково их общее сопротивление?','2 Ом~9 Ом~4,5 Ом~18 Ом','1/R=1/3+1/6=1/2, значит R=2 Ом. Параллельно общее сопротивление меньше меньшего.']],
ter:[['Сколько теплоты нужно, чтобы нагреть 2 кг воды на 10 °C? Удельная теплоёмкость воды 4200 Дж/(кг·°C).','84 кДж~8,4 кДж~840 кДж~42 кДж','Q=c·m·Δt=4200·2·10=84 000 Дж=84 кДж.'],['Что показывает удельная теплоёмкость вещества?','Сколько энергии нужно, чтобы нагреть 1 кг на 1 °C~Сколько тепла выделяет 1 кг при сгорании~При какой температуре вещество плавится~Как быстро вещество нагревается','Это энергия на 1 кг и 1 °C, поэтому единица — Дж/(кг·°C).'],['Вода массой 0,5 кг отдала 5 кДж теплоты (c=4200 Дж/(кг·°C)). Примерно на сколько градусов она остыла?','≈2,4 °C~≈10 °C~≈0,4 °C~≈24 °C','Δt=Q/(c·m)=5000/(4200·0,5)≈2,4 °C.'],['Как называется переход вещества из жидкого состояния в газообразное?','Парообразование~Плавление~Кристаллизация~Конденсация','Жидкость → пар: это парообразование (испарение или кипение).'],['Двигатель получил 500 Дж теплоты и совершил 100 Дж полезной работы. Чему равен его КПД?','20%~500%~80%~5%','КПД = полезная работа ÷ полученная теплота = 100/500 = 20%.'],['Может ли КПД теплового двигателя быть равен 100%?','Нет: часть энергии неизбежно уходит в окружающую среду~Да, если убрать трение~Да, при очень высокой температуре~Да, но только у электродвигателей','Часть теплоты всегда уходит холодильнику (наружу), поэтому КПД меньше 100%.']]};

Object.assign(QR,{
bal:[['Мяч бросили горизонтально со скоростью 5 м/с с высоты 20 м (g=10 м/с²). Сколько секунд он летит до земли?','2 с~4 с~1 с~0,4 с','По вертикали это свободное падение: t=√(2h/g)=√(40/10)=2 с. Горизонтальная скорость на время полёта не влияет.'],['Мяч бросили горизонтально со скоростью 5 м/с с высоты 20 м (g=10 м/с²). На каком расстоянии от точки броска по горизонтали он упадёт?','10 м~20 м~5 м~100 м','Время полёта 2 с, а по горизонтали движение равномерное: L=v₀·t=5·2=10 м.'],['Камень бросили под углом 30° к горизонту со скоростью 20 м/с. Чему равна горизонтальная составляющая скорости vx? (cos30°≈0,87)','≈17,4 м/с~10 м/с~20 м/с~≈11,5 м/с','vx=v₀·cosα=20·0,87≈17,4 м/с. Она не меняется за весь полёт.'],['Под каким углом к горизонту нужно бросить мяч, чтобы он улетел дальше всего (без сопротивления воздуха)?','45°~30°~60°~90°','L=v₀²·sin2α/g, а sin2α наибольший (равен 1) при 2α=90°, то есть α=45°.'],['Снаряд вылетел под углом 30° к горизонту со скоростью 20 м/с (g=10 м/с²). Сколько секунд он летит?','2 с~4 с~1 с~3,5 с','Вертикальная скорость vy=v₀·sin30°=10 м/с. Подъём длится 10/10=1 с, столько же спуск: всего 2 с.'],['Мяч бросили под углом 30° к горизонту со скоростью 20 м/с (g=10 м/с²). На какую наибольшую высоту он поднимется?','5 м~20 м~10 м~2,5 м','vy=20·0,5=10 м/с, H=vy²/(2g)=100/20=5 м.'],['Какую форму имеет траектория тела, брошенного под углом к горизонту (без сопротивления воздуха)?','Парабола~Окружность~Прямая линия~Зигзаг','По горизонтали движение равномерное, по вертикали — с постоянным ускорением g, поэтому траектория — парабола.']],
ang:[['Санки тянут за верёвку с силой 50 Н под углом 60° к горизонту. Какая часть силы тянет санки вперёд (горизонтальная проекция)? (cos60°=0,5)','25 Н~50 Н~43 Н~100 Н','Fx=F·cosα=50·0,5=25 Н. Вторая проекция немного приподнимает санки.'],['На тело действуют две силы 3 Н и 4 Н, направленные под прямым углом друг к другу. Чему равна их равнодействующая?','5 Н~7 Н~1 Н~12 Н','Силы складываются как векторы: √(3²+4²)=5 Н.'],['Брусок массой 2 кг лежит на наклонной плоскости с углом 30°. Чему равна составляющая силы тяжести вдоль плоскости? (g=10 м/с², sin30°=0,5)','10 Н~20 Н~17 Н~5 Н','Вдоль плоскости тянет mg·sinα=2·10·0,5=10 Н.'],['Брусок соскальзывает без трения с наклонной плоскости с углом 30°. С каким ускорением он движется? (g=10 м/с²)','5 м/с²~10 м/с²~8,7 м/с²~2 м/с²','a=g·sinα=10·0,5=5 м/с². Масса бруска не важна.'],['Брусок массой 5 кг тянут по полу. Коэффициент трения 0,2 (g=10 м/с²). Чему равна сила трения скольжения?','10 Н~20 Н~4 Н~100 Н','Fтр=μ·N=μ·m·g=0,2·5·10=10 Н.'],['Как меняется сила давления бруска на наклонную плоскость, если угол наклона увеличивать?','Уменьшается~Увеличивается~Не меняется~Сначала растёт, потом падает','N=mg·cosα, а косинус уменьшается при росте угла.'],['Ящик массой 10 кг тянут по гладкому полу силой 40 Н под углом 60° к горизонту. С каким ускорением он движется? (cos60°=0,5, трения нет)','2 м/с²~4 м/с²~3,5 м/с²~0,5 м/с²','Разгоняет только горизонтальная проекция Fx=40·0,5=20 Н, a=20/10=2 м/с².']],
circ:[['Карусель делает один полный оборот за 10 секунд. Чему равен её период вращения?','10 с~0,1 с~1 с~20 с','Период — время одного полного оборота: T=10 с.'],['Колесо делает 5 оборотов в секунду. Чему равна частота вращения?','5 Гц~0,2 Гц~10 Гц~1 Гц','Частота — число оборотов в секунду: ν=5 Гц.'],['Точка движется по окружности радиусом 2 м со скоростью 4 м/с. Чему равно её центростремительное ускорение?','8 м/с²~2 м/с²~16 м/с²~0,5 м/с²','aц=v²/R=16/2=8 м/с².'],['Куда направлено ускорение тела при равномерном движении по окружности?','К центру окружности~По касательной вперёд~От центра наружу~Вертикально вниз','Скорость всё время поворачивает к центру, поэтому и ускорение направлено к центру.'],['Автомобиль проходит поворот радиусом 50 м со скоростью 10 м/с. Каково его центростремительное ускорение?','2 м/с²~5 м/с²~0,2 м/с²~500 м/с²','aц=v²/R=100/50=2 м/с².'],['Точка на ободе колеса радиусом 0,5 м делает один оборот за 1 секунду. Какова её скорость? (π≈3,14)','≈3,14 м/с~0,5 м/с~≈6,28 м/с~1 м/с','За оборот точка проходит длину окружности: v=2πR/T=2·3,14·0,5/1≈3,14 м/с.'],['Скорость тела на окружности увеличили в 2 раза, а радиус оставили прежним. Как изменится центростремительное ускорение?','Вырастет в 4 раза~Вырастет в 2 раза~Не изменится~Уменьшится в 2 раза','aц=v²/R: скорость в квадрате, 2²=4.']],
grav:[['Как изменится сила притяжения между двумя телами, если расстояние между ними увеличить в 2 раза?','Уменьшится в 4 раза~Уменьшится в 2 раза~Увеличится в 2 раза~Не изменится','F=Gm₁m₂/r²: расстояние стоит в квадрате, 2²=4.'],['Массу одного из двух тел увеличили в 3 раза. Как изменится сила их притяжения?','Увеличится в 3 раза~Увеличится в 9 раз~Не изменится~Уменьшится в 3 раза','Сила прямо пропорциональна массе каждого тела.'],['Чему примерно равна первая космическая скорость для Земли?','≈7,9 км/с~≈11,2 км/с~≈340 м/с~≈300 000 км/с','v₁=√(gR)≈7,9 км/с — с такой скоростью спутник летит по круговой орбите у поверхности Земли.'],['Почему космонавты на орбитальной станции находятся в невесомости?','Они вместе со станцией свободно падают вокруг Земли~На орбите нет притяжения Земли~Их притягивает Луна~Станция вращается вокруг своей оси','Притяжение на орбите почти такое же, как у Земли, но станция и всё в ней падают с одинаковым ускорением.'],['Ускорение свободного падения на Луне ≈1,6 м/с². Сколько весит на Луне тело массой 50 кг?','80 Н~500 Н~50 Н~31 Н','Вес P=m·g=50·1,6=80 Н. Масса при этом остаётся 50 кг.'],['Масса планеты в 2 раза больше земной, а радиус такой же. Каково ускорение свободного падения на её поверхности? (у Земли g=10 м/с²)','20 м/с²~10 м/с²~5 м/с²~40 м/с²','g=GM/R²: при том же радиусе g пропорционально массе планеты.']],
prs:[['Ящик весом 600 Н стоит на полу, площадь опоры 2 м². Какое давление он оказывает на пол?','300 Па~1200 Па~600 Па~0,003 Па','p=F/S=600/2=300 Па.'],['Почему у ножа делают острое лезвие?','Маленькая площадь даёт большое давление~Острое лезвие легче~Так уменьшается сила~Так сталь прочнее','p=F/S: чем меньше площадь, тем больше давление при той же силе.'],['Каково давление воды на глубине 10 м? (ρ=1000 кг/м³, g=10 м/с², атмосферу не учитываем)','100 000 Па~10 000 Па~1000 Па~1 000 000 Па','p=ρgh=1000·10·10=100 000 Па.'],['Тело объёмом 0,002 м³ полностью погрузили в воду (ρ=1000 кг/м³, g=10 м/с²). Чему равна выталкивающая сила?','20 Н~2 Н~200 Н~0,02 Н','Fа=ρж·g·V=1000·10·0,002=20 Н.'],['В каком случае тело плавает в жидкости?','Когда сила Архимеда равна силе тяжести~Когда тело тяжелее жидкости~Только если тело полое~Когда у тела маленькая масса','Плавание: Fа=mg. Так бывает, если плотность тела не больше плотности жидкости.'],['Плотность льда 900 кг/м³, воды 1000 кг/м³. Какая часть льдины находится под водой?','90%~10%~50%~100%','Доля под водой = ρльда/ρводы = 900/1000 = 0,9. Поэтому айсберг виден лишь «верхушкой».']],
opt:[['Луч падает на зеркало под углом 30° к перпендикуляру. Под каким углом к перпендикуляру он отразится?','30°~60°~90°~15°','Угол отражения равен углу падения; оба отсчитывают от перпендикуляра.'],['Скорость света в стекле 200 000 км/с, а в вакууме 300 000 км/с. Чему равен показатель преломления стекла?','1,5~0,67~2~3','n=c/v=300 000/200 000=1,5.'],['Как меняется направление луча при переходе из воздуха в воду?','Луч приближается к перпендикуляру~Луч удаляется от перпендикуляра~Луч не меняет направления~Луч полностью отражается','Вода оптически плотнее воздуха, поэтому угол преломления меньше угла падения.'],['Фокусное расстояние линзы 0,5 м. Чему равна её оптическая сила?','2 дптр~0,5 дптр~5 дптр~1 дптр','D=1/F=1/0,5=2 диоптрии.'],['Предмет стоит в 30 см от собирающей линзы с фокусным расстоянием 10 см. На каком расстоянии от линзы получится изображение?','15 см~20 см~30 см~10 см','1/f=1/F−1/d=1/10−1/30=2/30, значит f=15 см.'],['Почему ложка в стакане с водой кажется «сломанной»?','Из-за преломления света на границе воды и воздуха~Из-за отражения света от стекла~Потому что вода увеличивает предметы~Из-за того, что вода окрашивает свет','Лучи от погружённой части преломляются на поверхности воды и приходят к глазу под другим углом.']],
qnt:[['Сколько протонов в ядре атома углерода-12 (массовое число 12, зарядовое число 6)?','6~12~18~3','Зарядовое число Z равно числу протонов: 6.'],['Сколько нейтронов в ядре углерода-12 (A=12, Z=6)?','6~12~18~0','N=A−Z=12−6=6.'],['Период полураспада вещества 10 дней. Какая часть радиоактивных ядер останется через 20 дней?','1/4~1/2~0~1/8','20 дней — это два периода: ½·½=¼.'],['Как изменится энергия фотона, если частоту света увеличить в 2 раза?','Увеличится в 2 раза~Уменьшится в 2 раза~Не изменится~Увеличится в 4 раза','E=hν: энергия фотона прямо пропорциональна частоте.'],['Фотоны какого света несут больше энергии — красного или фиолетового?','Фиолетового~Красного~Одинаковую энергию~Зависит от яркости','У фиолетового света частота больше, а E=hν.'],['Что называют фотоэффектом?','Вырывание электронов из вещества под действием света~Свечение вещества при нагревании~Отражение света от металла~Распад ядер под действием света','Фотон отдаёт энергию электрону и выбивает его из металла.']],
ineq:[['Решите неравенство 2x−4>0.','x>2~x<2~x>−2~x>4','2x>4, делим на положительное число 2: x>2.'],['Решите неравенство −3x<6.','x>−2~x<−2~x>2~x<2','Делим на отрицательное число −3, поэтому знак меняется: x>−2.'],['Какое наименьшее целое число удовлетворяет неравенству 3x+1>10?','4~3~10~1','3x>9, x>3. Наименьшее целое число, большее 3, — это 4.'],['Решите неравенство x²−9<0.','−3<x<3~x>3~x<−3 или x>3~x<3','Парабола y=x²−9 лежит ниже оси Ox между корнями −3 и 3.'],['Решите неравенство (x−1)(x−5)>0.','x<1 или x>5~1<x<5~x>5~x>1','Нули 1 и 5, ветви параболы вверх: выражение положительно снаружи промежутка между корнями.'],['Решите систему неравенств: x>2 и x<6.','2<x<6~x>6~x<2~Нет решений','Решение системы — общая часть промежутков: от 2 до 6.'],['Решите систему неравенств: x>5 и x<1.','Нет решений~1<x<5~x>5~x<1','Число не может быть одновременно больше 5 и меньше 1.']],
prog:[['Дана арифметическая прогрессия: 3, 7, 11, … Чему равна её разность d?','4~3~7~11','d=7−3=4: каждый член больше предыдущего на 4.'],['В арифметической прогрессии a₁=2 и d=3. Найдите десятый член a₁₀.','29~30~32~23','a₁₀=a₁+9d=2+27=29. От первого до десятого члена — 9 шагов.'],['Найдите сумму первых десяти натуральных чисел: 1+2+…+10.','55~50~100~45','S=(1+10)·10/2=55.'],['Дана геометрическая прогрессия: 2, 6, 18, … Чему равен её знаменатель q?','3~4~2~12','q=6/2=3: каждый член в 3 раза больше предыдущего.'],['В геометрической прогрессии b₁=3 и q=2. Найдите пятый член b₅.','48~30~96~24','b₅=b₁·q⁴=3·16=48.'],['Деньги положили в банк под 10% годовых с начислением процентов на проценты. Во сколько раз вырастет сумма за 2 года?','В 1,21 раза~В 1,2 раза~В 2 раза~В 1,1 раза','Каждый год сумма умножается на 1,1: 1,1²=1,21. Это геометрическая прогрессия.'],['Бактерии делятся каждый час: была 1, через час стало 2, через 2 часа — 4. Сколько их станет через 6 часов?','64~12~32~128','Геометрическая прогрессия с q=2: 2⁶=64.']],
prob:[['Бросают игральный кубик. Какова вероятность, что выпадет шестёрка?','1/6~1/2~1/3~6','Благоприятный исход один из шести равновозможных: P=1/6.'],['В мешке 3 красных и 7 синих шаров. Какова вероятность наугад вытащить красный?','0,3~0,7~3/7~0,5','P=m/n=3/(3+7)=0,3.'],['Вероятность дождя завтра 0,2. Какова вероятность, что дождя не будет?','0,8~0,2~1~0,5','P(не A)=1−P(A)=1−0,2=0,8.'],['Сколькими способами можно выстроить в очередь 4 человек?','24~16~4~12','Число перестановок 4!=1·2·3·4=24.'],['Монету подбрасывают 2 раза. Какова вероятность, что оба раза выпадет орёл?','1/4~1/2~1/3~1','Броски независимы, вероятности перемножаются: ½·½=¼.'],['В группе 5 человек. Сколькими способами можно выбрать старосту и его заместителя?','20~10~25~5','Старосту выбираем 5 способами, заместителя — из оставшихся 4: 5·4=20.']]});
const LS2={
bal:[['Горизонтальный бросок','Тело участвует сразу в двух движениях: по горизонтали летит равномерно со скоростью v₀, а по вертикали падает, как при свободном падении. Время полёта t=√(2h/g) зависит только от высоты, дальность L=v₀·t.','0,1,6','hor'],['Бросок под углом к горизонту','Разложим начальную скорость на проекции: vx=v₀·cosα, vy=v₀·sinα. По горизонтали скорость не меняется, по вертикали каждую секунду уменьшается на g. Время полёта t=2v₀·sinα/g, дальность L=v₀²·sin2α/g, высота H=v₀²·sin²α/(2g). Дальше всего летит бросок под 45°.','2,3,4,5']],
ang:[['Проекции силы и сложение сил','Силу под углом раскладываем на две проекции: Fx=F·cosα и Fy=F·sinα. Две перпендикулярные силы складываем по теореме Пифагора. Ускорение вдоль пола создаёт только проекция на направление движения.','0,1,6'],['Наклонная плоскость и трение','На склоне сила тяжести раскладывается на mg·sinα (скатывает тело вдоль склона) и mg·cosα (прижимает к склону). Сила реакции N=mg·cosα, сила трения Fтр=μN. Без трения тело скатывается с ускорением a=g·sinα.','2,3,4,5','incl']],
circ:[['Период, частота и скорость','T — время одного оборота, ν=1/T — число оборотов в секунду. За один оборот точка проходит длину окружности 2πR, поэтому v=2πR/T. Угловая скорость ω=2π/T связана с линейной: v=ωR.','0,1,5'],['Центростремительное ускорение','Скорость по величине постоянна, но всё время поворачивает — значит, есть ускорение. Оно направлено к центру и равно aц=v²/R. Его создаёт какая-то сила: натяжение нити, трение шин о дорогу, притяжение Земли.','3,2,4,6']],
grav:[['Закон всемирного тяготения','Любые два тела притягиваются с силой F=G·m₁m₂/r². Сила растёт вместе с массами и быстро убывает с расстоянием: вдвое дальше — в 4 раза слабее. Сила тяжести mg — частный случай этого закона: g=GM/R².','0,1,5,4'],['Спутники и невесомость','Если запустить тело горизонтально с первой космической скоростью ≈7,9 км/с, оно будет падать «вокруг» Земли и никогда не упадёт — станет спутником. Всё на орбите падает вместе, поэтому возникает невесомость.','2,3','orbit']],
prs:[['Давление твёрдых тел и жидкостей','Давление p=F/S показывает, какая сила приходится на 1 м² поверхности. В жидкости давление растёт с глубиной: p=ρgh. Единица давления — паскаль: 1 Па=1 Н/м².','0,1,2'],['Закон Архимеда и плавание тел','Жидкость давит на тело снизу сильнее, чем сверху, и выталкивает его силой Fа=ρж·g·Vт. Тело плавает, если Fа=mg, и тонет, если сила тяжести больше выталкивающей.','3,4,5']],
opt:[['Отражение и преломление света','Угол отражения равен углу падения. На границе двух сред свет преломляется: показатель преломления n=c/v показывает, во сколько раз в среде свет медленнее, чем в вакууме. Переходя в более плотную среду, луч прижимается к перпендикуляру.','0,1,2,5'],['Линзы','Собирающая линза сводит параллельные лучи в фокусе F. Оптическая сила D=1/F измеряется в диоптриях (F — в метрах). Формула линзы: 1/F=1/d+1/f, где d — расстояние до предмета, f — до изображения.','3,4']],
qnt:[['Строение атома и ядра','Атом — это маленькое положительное ядро и электроны вокруг него. Ядро с массовым числом A и зарядовым числом Z содержит Z протонов и N=A−Z нейтронов. За период полураспада T½ распадается половина радиоактивных ядер.','0,1,2'],['Фотоны и фотоэффект','Свет излучается и поглощается порциями — фотонами с энергией E=hν. Чем больше частота (короче длина волны), тем больше энергия фотона. Фотоэффект — свет выбивает электроны из металла, если энергии фотона хватает.','3,4,5']],
ineq:[['Линейные неравенства и системы','Решаем как уравнение, но помним главное: при умножении или делении на отрицательное число знак неравенства меняется на противоположный. Решение системы — общая часть решений всех её неравенств.','0,1,2,5,6'],['Квадратные неравенства','Найдите корни x₁ и x₂ и представьте параболу. Если ветви направлены вверх, выражение больше нуля снаружи корней и меньше нуля между ними. Это метод интервалов.','3,4']],
prog:[['Арифметическая прогрессия','Каждый следующий член больше предыдущего на одно и то же число d: aₙ=a₁+(n−1)d. Сумма первых n членов Sₙ=(a₁+aₙ)·n/2 — именно так юный Гаусс мгновенно сложил числа от 1 до 100.','0,1,2'],['Геометрическая прогрессия','Каждый следующий член в q раз больше предыдущего: bₙ=b₁·qⁿ⁻¹. Так растут вклады с процентами на проценты, колонии бактерий и просмотры вирусных видео.','3,4,5,6']],
prob:[['Классическая вероятность','Если все исходы равновозможны, P(A)=m/n: m — число благоприятных исходов, n — всех исходов. Вероятность всегда от 0 до 1. Вероятность противоположного события 1−P(A). Для независимых событий вероятности перемножаются.','0,1,2,4'],['Комбинаторика','Правило произведения: если первый выбор можно сделать a способами, а второй — b способами, то вместе — a·b способов. Число перестановок n разных предметов: n!=1·2·…·n.','3,5']]};
