const LS={
vec:[['Операции с векторами','Вектор задаётся координатами (x;y). Складывая векторы, складываем координаты: (1;2)+(3;4)=(4;6). Вычитание — так же. Длина вектора — по теореме Пифагора: √(x²+y²).','0,1,6,2'],['Умножение на число и перемещения','При умножении на число k каждая координата умножается на k: 2·(1;3)=(2;6). Перемещение за несколько шагов — это сумма векторов всех шагов.','5,3,4']],
eq:[['Дискриминант и число корней','D=b²−4ac. Если D&gt;0 — два корня, D=0 — один, D&lt;0 — действительных корней нет. Пример: x²−4x+3=0 → D=16−12=4, два корня.','1,3,5,6'],['Решение уравнений и задачи','Корни: x=(−b±√D)/(2a). Проверка по Виету: x₁+x₂=−b/a, x₁·x₂=c/a. В текстовых задачах длина и ширина не бывают отрицательными.','0,2,4']],
func:[['Линейная функция','y=kx+b: k задаёт наклон прямой, b — точку пересечения с осью y. Ось Ox прямая пересекает при y=0. Пример: y=2x−4 пересекает Ox в x=2.','0,1,4'],['Парабола: ветви, вершина, нули','y=ax²+bx+c. При a&gt;0 ветви вверх, при a&lt;0 вниз. Вершина: x₀=−b/(2a). Нули функции — решения уравнения y=0.','3,5,2,6']],
der:[['Правила дифференцирования','(c)′=0, (xⁿ)′=n·xⁿ⁻¹, (f+g)′=f′+g′. Пример: (3x²+5x)′=6x+5. Числовой множитель выносится за знак производной.','0,1,5,2'],['Производная в задачах','Производная пути — скорость. Там, где f′(x)=0, функция может иметь максимум или минимум: решите f′=0 и проверьте.','4,6,3']],
int:[['Первообразная','∫xⁿdx=xⁿ⁺¹/(n+1)+C. Интегрирование обратно дифференцированию: (x²)′=2x, значит ∫2x dx=x²+C. Постоянная C нужна всегда.','0,1,5'],['Определённый интеграл и путь','∫ₐᵇf dx=F(b)−F(a) — площадь под графиком. Путь равен интегралу скорости по времени.','2,6,3,4']],
kin:[['Равномерное движение','Скорость постоянна: s=v·t. Перевод: км/ч делим на 3,6 и получаем м/с. Пример: 72 км/ч = 20 м/с.','0,1,6'],['Равноускоренное движение','Скорость растёт на a каждую секунду: v=a·t, путь s=at²/2 (старт с покоя). Пример: a=2, t=4 → v=8 м/с, s=16 м.','2,3,5'],['Свободное падение','Это движение с ускорением g≈10 м/с²: h=gt²/2, v=gt, v=√(2gh). Масса тела на время падения не влияет.','4,7,8']],
new:[['Второй закон Ньютона','Ускорение прямо пропорционально силе и обратно пропорционально массе: a=F/m. Единица силы — ньютон: 1 Н=1 кг·м/с². Сила тяжести F=mg.','0,1,2,3'],['Третий закон и силы в задачах','Силы взаимодействия равны по модулю и противоположны, но приложены к разным телам. В задачах ищем равнодействующую: ma=F−Fтр; лифт: T−mg=ma.','7,4,6,5']],
en:[['Работа и мощность','Работа A=F·s (сила вдоль перемещения) измеряется в джоулях. Мощность P=A/t — работа за секунду, в ваттах. Пример: поднять 2 кг на 3 м — A=2·10·3=60 Дж.','0,9,7'],['Кинетическая и потенциальная энергия','Eк=mv²/2 — энергия движения, Eп=mgh — энергия высоты, Eп=kx²/2 — энергия пружины. Скорость вдвое больше — Eк в 4 раза больше.','1,2,3,8'],['Закон сохранения энергии: горки и падение','Без трения Eк+Eп=const: потенциальная энергия на горке превращается в кинетическую. Отсюда v=√(2gh), масса не нужна. С трением часть энергии уходит в тепло.','4,5,10,6','slide']],
imp:[['Импульс и закон его сохранения','Импульс p=m·v, единица кг·м/с. Теорема об импульсе: F·Δt=Δp. В замкнутой системе суммарный импульс до и после взаимодействия одинаков (выстрел, отдача).','0,1,2,8,4'],['Неупругое столкновение (тела слипаются)','Тела движутся дальше вместе: m₁v₁+m₂v₂=(m₁+m₂)·v. Импульс сохраняется, а часть механической энергии уходит в тепло и деформацию.','3,9,10,11','inel'],['Упругое столкновение','Сохраняются и импульс, и энергия. Для равных масс тела обмениваются скоростями. Если второе тело покоилось: v₁′=(m₁−m₂)v/(m₁+m₂), v₂′=2m₁v/(m₁+m₂).','12,5,6,7','el']],
osc:[['Период и частота','T — время одного колебания, ν=1/T — число колебаний в секунду (Гц). Если за время t было N колебаний, то T=t/N.','0,1,4'],['Маятник и пружина','Математический маятник: T=2π√(l/g), от массы не зависит. Длина в 4 раза больше — период в 2 раза больше. Пружинный маятник: T=2π√(m/k).','2,3,5']],
tri:[['Синус, косинус, тангенс','В прямоугольном треугольнике: sin α — противолежащий катет к гипотенузе, cos α — прилежащий к гипотенузе, tg α — противолежащий к прилежащему. Табличные значения: sin30°=1/2, sin45°=√2/2, sin60°=√3/2, tg45°=1.','0,1,2,3'],['Тождества и задачи','Главное тождество: sin²α+cos²α=1, а tg α=sin α/cos α. Зная синус острого угла, косинус находим из тождества. Высоту предмета находим как длина·sin угла.','5,4,6']],
ele:[['Закон Ома','Сила тока I=U/R: чем больше напряжение, тем больше ток; чем больше сопротивление, тем меньше. Единицы: ампер (А), вольт (В), ом (Ом). Пример: 12 В на 4 Ом дают 3 А.','0,1,2'],['Мощность и соединения проводников','Мощность тока P=U·I. Последовательно ток один, сопротивления складываются: R=R₁+R₂. Параллельно напряжение одно, 1/R=1/R₁+1/R₂ — общее сопротивление меньше меньшего.','3,4,5']],
ter:[['Количество теплоты','Чтобы нагреть тело, нужна теплота Q=c·m·Δt. Удельная теплоёмкость c — энергия для нагрева 1 кг на 1 °C (у воды 4200 Дж/(кг·°C)).','0,1,2'],['Агрегатные состояния и КПД','Плавление (твёрдое → жидкое), парообразование (жидкое → газ), конденсация и кристаллизация — обратные процессы. КПД=Aполезная/Qполученная всегда меньше 100%.','3,4,5']]};

const EX={
vec:['Типичные ошибки: складывать x-координату с y-координатой; путать a−c и c−a (это разные векторы). Проверка: длина суммы не больше суммы длин.','Умножение на число меняет обе координаты, а не одну. Отрицательное число разворачивает вектор. Если перемещения за равные промежутки времени одинаковы, просто умножьте на число промежутков.'],
eq:['Не теряйте знак b: в x²−4x+3 коэффициент b=−4. При D&lt;0 корень из D не извлекаем — действительных решений нет. Ровно один корень при D=0.','В теореме Виета x₁+x₂=−b/a (со знаком минус!). Проверяйте корни подстановкой. В задачах про длины отбрасывайте отрицательные корни.'],
func:['k — наклон, b — сдвиг по оси y: не меняйте их местами. Пересечение с Ox ищем из y=0, а с Oy — подставив x=0.','Вершина лежит на оси симметрии — посередине между нулями. Не путайте знак в x₀=−b/(2a).'],
der:['Показатель уменьшаем на 1, а старый показатель становится множителем. Производная числа равна нулю, производная суммы — сумма производных. Не забывайте подставить число в конце.','Скорость — производная пути, ускорение — производная скорости. Минимум и максимум ищем из f′=0; знак f′ слева и справа от точки подскажет, что это.'],
int:['Не забывайте +C у неопределённого интеграла. Проверка всегда рядом: продифференцируйте ответ — должна получиться исходная функция.','Определённый интеграл — число, без C. Сначала первообразная, затем F(b)−F(a). При постоянной скорости путь равен v·t.'],
kin:['Следите за единицами: км/ч → м/с делим на 3,6, а м/с → км/ч умножаем. Скорость — отношение пути ко времени, а не наоборот.','Путь при равноускоренном движении растёт как квадрат времени: за вдвое большее время путь в 4 раза больше, а скорость — только вдвое.'],
new:['Ускорение измеряется в м/с², а не в м/с. Масса — в килограммах (не в граммах!). Сила — вектор: важно, куда она направлена.','Силы третьего закона приложены к разным телам и не уравновешивают друг друга. Для движения нужна равнодействующая: сложите силы вдоль оси движения.'],
en:['Работу даёт только составляющая силы вдоль перемещения: если сила перпендикулярна движению, работа равна нулю. Мощность — работа за единицу времени.','Eк зависит от v², поэтому ошибка в скорости даёт большую ошибку в энергии. Высоту отсчитывайте от выбранного нуля потенциальной энергии.'],
imp:['Импульс — вектор: направление важно. Орудие до выстрела покоится, суммарный импульс равен нулю — значит, снаряд и орудие движутся в разные стороны. Единица кг·м/с равна Н·с.','При неупругом ударе энергия НЕ сохраняется (часть уходит в тепло), но импульс сохраняется всегда. В знаменателе — сумма масс.','Если массы равны, а второе тело стоит, тела обмениваются скоростями. Лёгкий шар, ударивший тяжёлый, отскакивает назад. Проверяйте ответ: суммарный импульс до и после должен совпасть.'],
osc:['Период измеряется в секундах, частота — в герцах; они взаимно обратны: ν=1/T. Если за время t было N колебаний, то T=t/N, а не N/t.','Период маятника зависит от длины и g, но не от массы. Корень «сглаживает»: длина в 4 раза больше — период в 2 раза.'],
tri:['sin — противолежащий катет к гипотенузе, cos — прилежащий. Запомните тройки (3;4;5) и (5;12;13). И ещё: sin30°=cos60°=1/2.','Из sin²α+cos²α=1 следует cos α=√(1−sin²α). Для острого угла косинус положителен. Не «теряйте» квадраты.'],
ele:['Закон Ома — для участка цепи: ток растёт с напряжением и падает с сопротивлением. Не путайте U=I·R и R=U/I.','Последовательно: ток один, сопротивления складываются. Параллельно: напряжение одно, общее сопротивление меньше самого малого. Два одинаковых — R/2.'],
ter:['Δt — разность температур, а не сама температура. Масса в кг. Переводите кДж в Дж: 1 кДж = 1000 Дж.','КПД всегда меньше 100%: часть теплоты уходит холодильнику. КПД = полезная работа / затраченная теплота, умноженное на 100%.']};

Object.assign(EX,{
bal:['Главная идея — независимость движений: время полёта определяется только вертикалью. Мяч, брошенный горизонтально, и мяч, просто отпущенный с той же высоты, упадут одновременно.','Не путайте sin и cos: vx=v₀·cosα (прилежащий катет), vy=v₀·sinα. В верхней точке vy=0, но vx остаётся — скорость там не равна нулю!'],
ang:['Угол обычно отсчитывают от горизонта, тогда горизонтальная проекция — через косинус. Если угол дан от вертикали, синус и косинус меняются местами — всегда смотрите на рисунок.','Частая ошибка — считать N=mg на наклоне. На склоне тело прижимается слабее: N=mg·cosα. Трение считайте через N, а не через mg.'],
circ:['Не путайте период и частоту: T — в секундах, ν — в герцах, ν=1/T. Если дано «N оборотов за t секунд», то T=t/N.','Центростремительное ускорение направлено к центру, а не наружу. «Центробежная сила», которую мы ощущаем в автобусе на повороте, — это инерция: тело стремится двигаться прямо.'],
grav:['Расстояние r считают между центрами тел. Для тела у поверхности планеты r — это её радиус, а не высота над землёй.','Невесомость — не отсутствие притяжения! На высоте МКС (около 400 км) притяжение слабее земного лишь примерно на 10%. Невесомость возникает, потому что станция и всё в ней свободно падают.'],
prs:['Площадь переводите в м²: 1 см² = 0,0001 м². Давление жидкости зависит от глубины, а не от формы сосуда.','Сила Архимеда зависит от объёма погружённой части и плотности ЖИДКОСТИ, а не тела. Тяжёлый и лёгкий шары одинакового объёма выталкиваются одинаково.'],
opt:['Углы падения, отражения и преломления отсчитывают от перпендикуляра к поверхности, а не от самой поверхности. Это самая частая ловушка.','В формуле D=1/F фокусное расстояние — обязательно в метрах: 20 см = 0,2 м, значит D=5 дптр.'],
qnt:['Массовое число A — это все нуклоны (протоны + нейтроны), зарядовое Z — только протоны. Нейтроны: N=A−Z. В нейтральном атоме электронов столько же, сколько протонов.','Яркость света — это количество фотонов, а энергия одного фотона зависит только от частоты. Поэтому слабый ультрафиолет может вызвать фотоэффект, а яркий красный свет — нет.'],
ineq:['Главная ловушка — деление на отрицательное число: −2x>4 даёт x<−2, а не x>−2. Проверяйте ответ: подставьте любое число из найденного промежутка.','Следите за направлением ветвей: если старший коэффициент отрицательный, знаки меняются местами. Строгое неравенство (> или <) не включает сами корни.'],
prog:['В формуле aₙ=a₁+(n−1)d стоит (n−1), а не n: от первого до десятого члена всего 9 шагов. Разность может быть отрицательной — тогда прогрессия убывает.','Не путайте прогрессии: арифметическая — «прибавляем d», геометрическая — «умножаем на q». Проценты на проценты — это всегда геометрическая прогрессия.'],
prob:['Сначала посчитайте ВСЕ равновозможные исходы. Ошибка: «шар либо красный, либо синий, значит ½». Нет — если синих больше, вытащить синий проще.','Важен ли порядок? Староста и заместитель — порядок важен: n·(n−1). Просто «выбрать двоих» — порядок не важен, ответ вдвое меньше.']});

return `<div class="grid c2" style="grid-template-columns:1.6fr 1fr"><div class="card"><div class="row sp"><b class="bh">${ic('cross')} Попади во флажок!</b><span class="mut">Цель: <b>${b.tg} м</b></span></div><svg id="bsv" viewBox="0 0 600 300" style="margin-top:10px;border-radius:14px;background:var(--soft)"><path d="M0 285H600" stroke="currentColor" stroke-opacity=".3" stroke-width="3"/>${[.25,.5,.75,1].map(f=>`<text x="${20+560*f}" y="298" font-size="11" text-anchor="middle" fill="currentColor" opacity=".5">${Math.round(lbR()*f)} м</text>`).join('')}<g id="btr">${b.tr.map((t,i)=>`<path d="${t}" fill="none" stroke="#B08CF7" stroke-width="2" opacity="${.25+.12*i}" stroke-dasharray="5 5"/>`).join('')}</g><g transform="translate(${20+b.tg*k} 285)"><path d="M0 0V-34" stroke="#1C2B5E" stroke-width="2.5"/><path d="M0 -34L22 -27L0 -20Z" fill="#E0607E"><animateTransform attributeName="transform" type="skewY" values="0;-6;0" dur="1.5s" repeatCount="indefinite"/></path><ellipse cy="0" rx="14" ry="3" fill="#E0607E" opacity=".35"/></g><path id="bpth" d="" fill="none" stroke="#7C4DDF" stroke-width="3"/><g id="bcn" transform="translate(20 285) rotate(${-b.a})"><rect x="-4" y="-7" width="36" height="14" rx="6" fill="#1C2B5E"/></g><circle cx="20" cy="285" r="10" fill="#7C4DDF"/><circle id="bbl" cx="20" cy="285" r="7" fill="#F2A15F" opacity="0"/></svg>

function balCalc(){const b=M.lb,r=b.a*Math.PI/180,s=Math.sin(r),c=Math.cos(r);return{vx:b.v*c,vy:b.v*s,t:2*b.v*s/b.g,L:b.v*b.v*Math.sin(2*r)/b.g,H:b.v*b.v*s*s/(2*b.g)}}
function balUpd(){const b=M.lb,o=balCalc(),el=id=>document.getElementById(id);if(!el('bsv'))return;el('lv').textContent=f1(b.v)+' м/с';el('la').textContent=b.a+'°';el('bcn').setAttribute('transform',`translate(20 285) rotate(${-b.a})`);

function fire(){const b=M.lb;if(b.run)return;b.run=1;const o=balCalc(),k=560/lbR(),r=b.a*Math.PI/180,el=id=>document.getElementById(id),P=el('bpth'),B=el('bbl'),T0=performance.now(),D=Math.min(2600,700+o.t*260);let d='M20 285';B.setAttribute('opacity',1);el('bmsg').textContent='';

()=>['Мяч лежит на полу вагона, который движется равномерно. Вагон начинает тормозить. Куда покатится мяч относительно вагона и как он движется относительно Земли? Объясните с точки зрения инерциальных и неинерциальных систем отсчёта.','Относительно вагона — вперёд; относительно Земли (ИСО) мяч по инерции продолжает двигаться с прежней скоростью, а вагон замедляется. Система «вагон» при торможении неинерциальна.']]},
{r:/втор[а-яё]* закон ньютон/i,tp:'new',ill:'new',
goals:['Знать второй закон Ньютона и единицу силы.','Применять закон к задачам с несколькими силами (в проекциях).','Связывать задачи динамики и кинематики.'],
idea:['Ускорение тела прямо пропорционально равнодействующей всех приложенных сил и обратно пропорционально его массе: a⃗ = F⃗/m.','Ускорение направлено так же, как равнодействующая сила, — не обязательно по скорости.','1 Н — сила, сообщающая телу массой 1 кг ускорение 1 м/с².','Алгоритм: рисунок сил → выбрать оси → записать ma = ΣF в проекциях → решить.'],
f:['a⃗ = F⃗ / m','F⃗ = m·a⃗','1 Н = 1 кг·м/с²','ΣFx = m·ax'],
ex:['Автомобиль массой 1,5 т разгоняется из состояния покоя до 20 м/с за 10 с. Сила сопротивления 500 Н. Найдите силу тяги.','Дано: m = 1500 кг, v₀ = 0, v = 20 м/с, t = 10 с, Fс = 500 Н. Решение: a = (v − v₀)/t = 2 м/с²; на ось движения: ma = Fт − Fс ⇒ Fт = ma + Fс = 1500·2 + 500 = 3500 Н. Ответ: 3,5 кН.'],
chk:[['Сила 12 Н сообщает телу ускорение 3 м/с². Какова масса тела?','4 кг'],['Как изменится ускорение, если силу увеличить в 2 раза, а массу — в 4 раза?','Уменьшится в 2 раза.'],['Может ли тело двигаться в одну сторону, а равнодействующая быть направлена в другую?','Да, при торможении: ускорение и сила направлены против скорости.']],
err:['Подставляют одну силу вместо равнодействующей всех сил.','Не переводят массу в килограммы (т, г).','Считают, что сила всегда направлена по скорости.'],
hw:[()=>{const m=RN([2,4,5]),a=RN([2,3,4]),t=RN([3,5]);return[`Тело массой ${m} кг из состояния покоя движется под действием силы ${m*a} Н. Найдите ускорение и скорость тела через ${t} с.`,`a = F/m = ${a} м/с²; v = at = ${a*t} м/с`]},
()=>{const m=RN([10,20,40]),a=RN([1,2]),f=RN([10,20]),t=RN([4,6]);return[`Тележку массой ${m} кг тянут горизонтальной силой ${m*a+f} Н, сила сопротивления ${f} Н. Найдите ускорение и путь за ${t} с из состояния покоя.`,`a = (F − Fс)/m = ${a} м/с²; s = at²/2 = ${a*t*t/2} м`]},
()=>{const m=RN([1,1.2,1.5]),v=RN([54,72]),t=RN([4,5]);return[`Автомобиль массой ${N2(m)} т, двигаясь со скоростью ${v} км/ч, тормозит и останавливается через ${t} с. Найдите тормозящую силу. Во сколько раз она меньше силы тяжести автомобиля? (g = 10 м/с²)`,`v = ${v/3.6} м/с; a = v/t = ${N2(v/3.6/t)} м/с²; F = ma = ${N2(m*1000*v/3.6/t)} Н; mg/F = ${N2(10/(v/3.6/t))}`]}]},
{r:/трет[а-яё]* закон ньютон/i,tp:'new',ill:'new',
goals:['Знать третий закон Ньютона.','Различать силы, приложенные к разным телам, и уравновешивающие силы.','Применять закон для двух взаимодействующих тел.'],
idea:['Тела действуют друг на друга с силами, равными по модулю и противоположными по направлению: F⃗₁₂ = −F⃗₂₁.','Эти силы приложены к РАЗНЫМ телам, поэтому они не уравновешивают друг друга.','Силы взаимодействия всегда одной природы (обе — упругости, обе — тяготения и т. д.).','Пример: ракета отбрасывает газы назад, газы толкают ракету вперёд.'],
f:['F⃗₁₂ = −F⃗₂₁','|F₁₂| = |F₂₁|','m₁a₁ = m₂a₂'],
ex:['Мальчик массой 50 кг на коньках отталкивает санки массой 10 кг с силой 20 Н. Найдите ускорения мальчика и санок (трением пренебречь).','Решение: по третьему закону санки действуют на мальчика с силой 20 Н в обратную сторону. a₁ = F/m₁ = 20/50 = 0,4 м/с²; a₂ = F/m₂ = 20/10 = 2 м/с². Ответ: 0,4 м/с² и 2 м/с², ускорения направлены противоположно.'],
chk:[['Земля притягивает яблоко с силой 2 Н. С какой силой яблоко притягивает Землю?','2 Н'],['Лошадь тянет телегу, а телега — лошадь с такой же силой. Почему они движутся?','Силы приложены к разным телам; лошадь разгоняет сила трения покоя копыт о дорогу, которая больше силы сопротивления телеги.'],['Почему ружьё при выстреле «отдаёт» в плечо?','Пуля действует на ружьё с силой, равной по модулю силе, с которой ружьё разгоняет пулю.']],
err:['Складывают действие и противодействие, как будто они приложены к одному телу.','Думают, что более массивное тело действует с большей силой.'],
hw:[()=>{const m1=RN([40,50,60]),m2=RN([20,25,30]),a=RN([0.5,1]);return[`Два мальчика на коньках массами ${m1} кг и ${m2} кг оттолкнулись друг от друга. Первый получил ускорение ${N2(a)} м/с². Найдите силу взаимодействия и ускорение второго.`,`F = m₁a₁ = ${N2(m1*a)} Н; a₂ = F/m₂ = ${N2(m1*a/m2)} м/с²`]},
()=>{const m=RN([0.5,1,2]);return[`Книга массой ${N2(m)} кг лежит на столе. Изобразите все силы, действующие на книгу и на стол. Назовите пары сил по третьему закону Ньютона и найдите их модули (g = 10 м/с²).`,`Пары: «Земля→книга (mg)» и «книга→Земля», по ${N2(m*10)} Н; «стол→книга (N)» и «книга→стол (вес P)», по ${N2(m*10)} Н. mg и N — не пара по 3-му закону (приложены к одному телу).`]},
()=>{const m1=RN([1,2]),m2=RN([3,4]),a=RN([2,3]);return[`Между тележками массами ${m1} кг и ${m2} кг сжата пружина. После пережигания нити первая тележка получила ускорение ${a} м/с². Найдите ускорение второй. Во сколько раз будут отличаться пути тележек за одно и то же время?`,`a₂ = m₁a₁/m₂ = ${N2(m1*a/m2)} м/с²; s₁/s₂ = a₁/a₂ = m₂/m₁ = ${N2(m2/m1)}`]}]},
{r:/вес тела|невесом|перегруз/i,tp:'new',svg:'lift',
goals:['Различать вес тела и силу тяжести.','Рассчитывать вес тела, движущегося с ускорением вверх и вниз.','Объяснять невесомость и перегрузки.'],
idea:['Вес тела P — сила, с которой тело давит на опору или растягивает подвес. Вес приложен к опоре, а сила тяжести mg — к самому телу.','В покое или при равномерном движении P = mg.','Ускорение направлено вверх: P = m(g + a) — перегрузка. Ускорение вниз: P = m(g − a).','Если тело движется с ускорением a = g (свободное падение, орбита), P = 0 — невесомость.'],
f:['P = mg  (a = 0)','P = m(g + a)  — a⃗ вверх','P = m(g − a)  — a⃗ вниз','P = 0 при a = g'],
ex:['Человек массой 60 кг стоит в лифте, который начинает подниматься с ускорением 2 м/с². Найдите вес человека (g = 10 м/с²).','Дано: m = 60 кг, a = 2 м/с² (вверх). Решение: на человека действуют mg вниз и N вверх. Ось вверх: ma = N − mg ⇒ N = m(g + a) = 60·12 = 720 Н. По третьему закону P = N = 720 Н. Ответ: 720 Н — перегрузка 1,2.'],
chk:[['Лифт при подъёме тормозит с ускорением 2 м/с². Каков вес человека массой 50 кг?','P = m(g − a) = 400 Н'],['Чем вес отличается от силы тяжести?','Вес приложен к опоре или подвесу, сила тяжести — к телу; при ускорении вес не равен mg.'],['Почему космонавты на МКС невесомы, хотя притяжение Земли там почти такое же?','Станция и космонавт свободно падают с одинаковым ускорением, поэтому не давят на опору.']],
err:['Путают вес и массу («вес 60 кг»). Вес — сила, измеряется в ньютонах.','Ошибаются в знаке: важно направление ускорения, а не скорости.'],
hw:[()=>{const m=RN([50,60,70]),a=RN([1,2,3]);return[`Лифт поднимается с ускорением ${a} м/с², направленным вверх. Найдите вес пассажира массой ${m} кг (g = 10 м/с²). Сделайте рисунок сил.`,`P = m(g + a) = ${m*(10+a)} Н`]},
()=>{const m=RN([50,60,80]),a=RN([1,2]);return[`Лифт, двигаясь вниз, тормозит с ускорением ${a} м/с². Найдите вес пассажира массой ${m} кг и перегрузку P/(mg). Куда направлено ускорение? (g = 10 м/с²)`,`ускорение вверх; P = m(g + a) = ${m*(10+a)} Н; перегрузка ${N2((10+a)/10)}`]},
()=>{const R=RN([40,90,160]),m=RN([1,1.5,2]);return[`Автомобиль массой ${N2(m)} т проезжает верхнюю точку выпуклого моста радиусом ${R} м со скоростью 10 м/с. Найдите вес автомобиля. При какой скорости в верхней точке наступит невесомость? (g = 10 м/с²)`,`P = m(g − v²/R) = ${N2(m*1000*(10-100/R))} Н; невесомость при v = √(gR) = ${N2(Math.sqrt(10*R))} м/с`]}]},
{r:/упруг|гук/i,tp:'new',svg:'spring',
goals:['Знать закон Гука и понятие жёсткости.','Объяснять устройство динамометра.','Решать задачи на удлинение пружин и равновесие груза.'],
idea:['Сила упругости возникает при деформации тела и направлена против деформации — стремится вернуть телу прежнюю форму.','Закон Гука (для малых упругих деформаций): Fупр = k·Δl, в проекции Fx = −k·x.','k — жёсткость, Н/м; зависит от материала, длины и толщины тела.','Динамометр — пружина со шкалой: по удлинению измеряют силу. График F(Δl) — прямая через начало координат.'],
f:['Fупр = k·Δl','Fx = −k·x','k = F / Δl,  [k] = Н/м','груз на пружине в покое: kΔl = mg'],
ex:['К пружине жёсткостью 200 Н/м подвесили груз массой 0,4 кг. На сколько удлинилась пружина? (g = 10 м/с²)','Решение: в равновесии Fупр = mg ⇒ kΔl = mg ⇒ Δl = mg/k = 0,4·10/200 = 0,02 м. Ответ: 2 см.'],
chk:[['Пружину растянули на 3 см силой 6 Н. Какова её жёсткость?','200 Н/м'],['Как изменится удлинение пружины, если массу груза увеличить в 3 раза?','Увеличится в 3 раза.'],['Куда направлена сила упругости нити, на которой висит груз?','Вдоль нити вверх, к точке подвеса.']],
err:['Не переводят сантиметры в метры.','Путают длину пружины l и её удлинение Δl.'],
hw:[()=>{const k=RN([100,200,400]),x=RN([2,3,5]),y=RN([4,6,8]);return[`Под действием силы ${N2(k*x/100)} Н пружина удлинилась на ${x} см. Найдите жёсткость пружины. Какая сила растянет её на ${y} см?`,`k = F/Δl = ${k} Н/м; F₂ = k·Δl₂ = ${N2(k*y/100)} Н`]},
()=>{const k=RN([100,200,250]),m=RN([200,300,500]),a=RN([2,5]);return[`Груз массой ${m} г подвешен к пружине жёсткостью ${k} Н/м. Найдите удлинение пружины в покое и в лифте, который разгоняется вверх с ускорением ${a} м/с² (g = 10 м/с²).`,`в покое Δl = mg/k = ${N2(m/1000*10/k*100)} см; в лифте Δl = m(g + a)/k = ${N2(m/1000*(10+a)/k*100)} см`]},
()=>{const k=RN([200,300,400]),m=RN([1,2]);return[`Две одинаковые пружины жёсткостью ${k} Н/м соединили последовательно (одну под другой) и подвесили груз массой ${m} кг. Найдите жёсткость системы и общее удлинение (g = 10 м/с²). Как изменится ответ при параллельном соединении?`,`последовательно k = ${k/2} Н/м, Δl = ${N2(m*10/(k/2)*100)} см; параллельно k = ${2*k} Н/м, Δl = ${N2(m*10/(2*k)*100)} см`]}]},
{r:/трени/i,tp:'ang',ill:'ang',
goals:['Знать виды трения: покоя, скольжения, качения.','Применять формулу Fтр = μN.','Решать задачи с трением на горизонтальной поверхности.'],
idea:['Сила трения возникает при соприкосновении тел и направлена против относительного движения (или против возможного движения).','Трение покоя меняется от нуля до максимального значения μN: если тянуть слабее, тело не сдвинется.','Трение скольжения: Fтр = μN, где N — сила нормальной реакции опоры, μ — коэффициент трения (безразмерный).','Трение качения намного меньше трения скольжения — поэтому используют колёса и подшипники.'],
f:['Fтр = μ·N','на горизонтали: N = mg ⇒ Fтр = μmg','Fтр.покоя ≤ μN','μ = Fтр / N'],
ex:['Санки массой 8 кг тянут по снегу горизонтальной силой 30 Н. Коэффициент трения 0,2. С каким ускорением движутся санки? (g = 10 м/с²)','Решение: N = mg = 80 Н; Fтр = μN = 16 Н; ma = F − Fтр ⇒ a = (30 − 16)/8 = 1,75 м/с². Ответ: 1,75 м/с².'],
chk:[['Шкаф массой 50 кг, μ = 0,3. Какую горизонтальную силу нужно приложить, чтобы двигать его равномерно?','150 Н'],['Брусок тянут силой 2 Н, но он не сдвигается. Чему равна сила трения покоя?','2 Н'],['Зачем зимой посыпают тротуары песком?','Чтобы увеличить коэффициент трения.']],
err:['Всегда пишут Fтр = μmg — даже на склоне или когда сила тянет под углом (там N ≠ mg).','Считают трение покоя всегда равным μN.'],
hw:[()=>{const m=RN([20,30,40]),mu=RN([0.2,0.3,0.4]);return[`Ящик массой ${m} кг равномерно тянут по полу горизонтальной силой ${N2(mu*m*10)} Н. Найдите коэффициент трения (g = 10 м/с²).`,`μ = F/(mg) = ${N2(mu)}`]},
()=>{const v=RN([36,54,72]),mu=RN([0.4,0.5]);return[`Автомобиль, ехавший со скоростью ${v} км/ч, резко затормозил (колёса заблокированы). Коэффициент трения шин о дорогу ${N2(mu)}. Найдите ускорение, время и тормозной путь (g = 10 м/с²).`,`a = μg = ${N2(mu*10)} м/с²; t = v/a = ${N2(v/3.6/(mu*10))} с; s = v²/(2μg) = ${N2((v/3.6)**2/(2*mu*10))} м`]},
()=>{const m=RN([2,4,5]),F=RN([20,30]),mu=0.2;return[`Брусок массой ${m} кг тянут по столу силой ${F} Н, направленной под углом 30° к горизонту вверх. μ = 0,2. Найдите силу трения и ускорение бруска (g = 10 м/с², sin30° = 0,5, cos30° ≈ 0,87).`,`N = mg − F·sin30° = ${N2(m*10-F*0.5)} Н; Fтр = μN = ${N2(mu*(m*10-F*0.5))} Н; a = (F·cos30° − Fтр)/m ≈ ${N2((F*0.87-mu*(m*10-F*0.5))/m)} м/с²`]}]},
{r:/нескольк[а-яё]* сил|равнодейств|сложени[а-яё]* сил/i,tp:'ang',ill:'new',
goals:['Находить равнодействующую нескольких сил.','Применять алгоритм решения задач динамики.','Записывать второй закон Ньютона в проекциях.'],
idea:['Если на тело действуют несколько сил, ускорение определяет их равнодействующая: m·a⃗ = F⃗₁ + F⃗₂ + …','Алгоритм: 1) рисунок и все силы; 2) оси — одну вдоль ускорения; 3) второй закон в проекциях; 4) решить систему уравнений.','Типичные силы: тяжести mg, реакции опоры N, натяжения T, упругости kΔl, трения μN.','Проверяйте ответ по единицам и здравому смыслу.'],
f:['m·a⃗ = ΣF⃗','Ox: m·aₓ = ΣFₓ','Oy: m·a_y = ΣF_y','Fтр = μN'],
ex:['Два бруска массами 2 кг и 3 кг связаны нитью и лежат на гладком столе. Второй брусок тянут силой 10 Н. Найдите ускорение и силу натяжения нити.','Решение: для системы (m₁ + m₂)a = F ⇒ a = 10/5 = 2 м/с². Для первого бруска: T = m₁a = 2·2 = 4 Н. Ответ: 2 м/с²; 4 Н.'],
chk:[['Тело массой 2 кг тянут вверх силой 30 Н. С каким ускорением оно поднимается? (g = 10 м/с²)','5 м/с²'],['Груз 1 кг висит на нити в лифте, который движется с ускорением 2 м/с² вниз. Чему равна сила натяжения нити?','8 Н'],['Равнодействующая сил равна нулю. Каким может быть движение тела?','Покой или равномерное прямолинейное движение.']],
err:['Забывают какую-нибудь силу (чаще всего трение или реакцию опоры).','Путают знаки проекций.'],
hw:[()=>{const m=RN([50,100,200]),a=RN([1,2]);return[`Груз массой ${m} кг поднимают на тросе с ускорением ${a} м/с². Найдите силу натяжения троса (g = 10 м/с²). Сделайте рисунок сил.`,`T = m(g + a) = ${m*(10+a)} Н`]},
()=>{const m=RN([2,5]),F=RN([20,30]),mu=RN([0.2,0.3]),t=RN([2,4]);return[`Брусок массой ${m} кг тянут по столу горизонтальной силой ${F} Н, коэффициент трения ${N2(mu)}. Найдите ускорение и путь за ${t} с из состояния покоя (g = 10 м/с²).`,`a = (F − μmg)/m = ${N2((F-mu*m*10)/m)} м/с²; s = at²/2 = ${N2((F-mu*m*10)/m*t*t/2)} м`]},
()=>{const m1=RN([1,2]),m2=RN([3,4]);return[`Через неподвижный блок перекинута нить с грузами ${m1} кг и ${m2} кг. Найдите ускорение грузов и силу натяжения нити (g = 10 м/с², нить и блок невесомы).`,`a = (m₂ − m₁)g/(m₁ + m₂) = ${N2((m2-m1)*10/(m1+m2))} м/с²; T = 2m₁m₂g/(m₁ + m₂) = ${N2(2*m1*m2*10/(m1+m2))} Н`]}]},
{r:/наклонн/i,tp:'ang',ill:'ang',
goals:['Раскладывать силу тяжести на составляющие вдоль и поперёк наклонной плоскости.','Находить силу реакции опоры, силу трения и ускорение на склоне.','Определять условие покоя тела на склоне.'],
idea:['На тело на склоне действуют: сила тяжести mg, реакция опоры N (перпендикулярно склону) и, если есть, сила трения.','Ось Ox удобно направить вдоль склона, Oy — перпендикулярно ему. Проекции силы тяжести: mg·sinα вдоль склона и mg·cosα перпендикулярно.','Отсюда N = mg·cosα и Fтр = μmg·cosα.','Ускорение при соскальзывании a = g(sinα − μcosα); без трения a = g·sinα. Тело покоится, если tgα ≤ μ.'],
f:['N = mg·cosα','Fтр = μmg·cosα','a = g(sinα − μ·cosα)','без трения: a = g·sinα'],
ex:['Брусок соскальзывает с наклонной плоскости с углом 30°, коэффициент трения 0,2. Найдите ускорение (g = 10 м/с², sin30° = 0,5, cos30° ≈ 0,87).','Решение: ось Ox вдоль склона вниз: ma = mg·sinα − μmg·cosα ⇒ a = g(sinα − μcosα) = 10·(0,5 − 0,2·0,87) ≈ 3,3 м/с². Ответ: ≈ 3,3 м/с².'],
chk:[['Чему равна сила реакции опоры для бруска 2 кг на склоне 60°? (cos60° = 0,5, g = 10 м/с²)','10 Н'],['С каким ускорением тело скользит без трения со склона 30°?','5 м/с²'],['При каком условии брусок покоится на склоне?','Если tgα ≤ μ.']],
err:['Пишут N = mg на склоне (правильно N = mg·cosα).','Путают синус и косинус при разложении mg.'],
hw:[()=>{const m=RN([2,4,5]);return[`Тело массой ${m} кг соскальзывает без трения с наклонной плоскости с углом 30°. Найдите ускорение тела и силу реакции опоры (g = 10 м/с², cos30° ≈ 0,87).`,`a = g·sin30° = 5 м/с²; N = mg·cos30° ≈ ${N2(m*10*0.87)} Н`]},
()=>{const m=RN([10,20,40]),mu=RN([0.1,0.2,0.3]);return[`Какую силу, направленную вдоль склона, нужно приложить, чтобы равномерно втаскивать ящик массой ${m} кг вверх по наклонной плоскости с углом 30°? μ = ${N2(mu)} (g = 10 м/с², cos30° ≈ 0,87).`,`F = mg(sinα + μcosα) ≈ ${N2(m*10*(0.5+mu*0.87))} Н`]},
()=>{const L=RN([2,4,8]),mu=RN([0.1,0.2]);const a=10*(0.5-mu*0.87);return[`Шайба начинает скользить из состояния покоя с вершины склона длиной ${L} м с углом 30°, μ = ${N2(mu)}. Найдите ускорение, время спуска и скорость у основания (g = 10 м/с², cos30° ≈ 0,87).`,`a ≈ ${N2(a)} м/с²; t = √(2L/a) ≈ ${N2(Math.sqrt(2*L/a))} с; v = √(2aL) ≈ ${N2(Math.sqrt(2*a*L))} м/с`]}]},
{r:/свободного падения на|на планетах/i,tp:'grav',ill:'grav',
goals:['Выводить формулу ускорения свободного падения из закона тяготения.','Сравнивать g на разных планетах.','Объяснять зависимость g от высоты.'],
idea:['Сила тяжести — это сила всемирного тяготения со стороны планеты: mg = G·mM/R².','Отсюда g = G·M/R²: ускорение свободного падения зависит только от массы и радиуса планеты, но не от массы тела.','С высотой g уменьшается: g_h = G·M/(R + h)².','Примерные значения: Земля 9,8 м/с², Луна 1,6 м/с², Марс 3,7 м/с², Юпитер ≈ 25 м/с².'],
f:['g = G·M / R²','g_h = G·M / (R + h)²','P = m·g'],
ex:['Масса Марса ≈ 0,107 массы Земли, радиус ≈ 0,53 земного. Найдите g на Марсе (g Земли = 9,8 м/с²).','Решение: g_М/g_З = (M_М/M_З)·(R_З/R_М)² = 0,107/0,53² ≈ 0,38; g_М ≈ 0,38·9,8 ≈ 3,7 м/с². Ответ: ≈ 3,7 м/с².'],
chk:[['Зависит ли g от массы падающего тела?','Нет, только от массы и радиуса планеты (и высоты).'],['Во сколько раз g на высоте h = R меньше, чем у поверхности?','В 4 раза.'],['Каков вес тела массой 10 кг на Луне (g = 1,6 м/с²)?','16 Н']],
err:['Путают массу и вес: масса на Луне такая же, вес меньше.','Подставляют высоту h вместо расстояния R + h.'],
hw:[()=>{const m=RN([50,60,70]);return[`Космонавт массой ${m} кг. Найдите его вес на Земле, на Луне (1,6 м/с²) и на Марсе (3,7 м/с²). Изменится ли его масса?`,`${m*10} Н; ${N2(m*1.6)} Н; ${N2(m*3.7)} Н; масса не меняется`]},
()=>{const k=RN([2,4,8]),n=RN([2]);return[`Масса планеты в ${k} раз больше массы Земли, а радиус в ${n} раза больше. Найдите ускорение свободного падения на её поверхности (на Земле g = 10 м/с²).`,`g = 10·${k}/${n}² = ${N2(10*k/(n*n))} м/с²`]},
()=>['На какой высоте над поверхностью Земли ускорение свободного падения в 4 раза меньше, чем у поверхности? А в 9 раз меньше? Радиус Земли 6400 км.','h = R = 6400 км; h = 2R = 12 800 км']]},
{r:/спутник|космическ[а-яё]* скорост/i,tp:'grav',ill:'grav',
goals:['Объяснять, почему спутник не падает на Землю.','Выводить и применять формулу первой космической скорости.','Рассчитывать скорость и период спутника.'],
idea:['Спутник движется по окружности: сила тяготения сообщает ему центростремительное ускорение.','GMm/r² = mv²/r ⇒ v = √(GM/r), где r = R + h — расстояние от центра планеты.','У поверхности Земли: v₁ = √(gR) ≈ 7,9 км/с — первая космическая скорость.','Чем выше орбита, тем меньше скорость спутника и больше период T = 2πr/v.'],
f:['v = √(G·M / r)','v₁ = √(g·R) ≈ 7,9 км/с','T = 2πr / v','v₂ ≈ 11,2 км/с'],
ex:['Найдите первую космическую скорость для Луны: g = 1,6 м/с², R = 1700 км.','Решение: v₁ = √(gR) = √(1,6·1,7·10⁶) ≈ √(2,72·10⁶) ≈ 1650 м/с. Ответ: ≈ 1,65 км/с.'],
chk:[['Почему спутник не падает на Землю?','Он «падает» всё время, но из-за большой скорости поверхность Земли «уходит» из-под него — получается движение по окружности.'],['Как изменится скорость спутника, если радиус орбиты увеличить в 4 раза?','Уменьшится в 2 раза.'],['Чему равна первая космическая скорость для Земли?','≈ 7,9 км/с']],
err:['Подставляют высоту h вместо радиуса орбиты R + h.','Забывают переводить километры в метры.'],
hw:[()=>{const g=RN([3.7,8.9]),R=g==3.7?3400:6050;return[`Найдите первую космическую скорость для планеты с g = ${N2(g)} м/с² и радиусом ${R} км.`,`v₁ = √(gR) ≈ ${N2(Math.sqrt(g*R*1000)/1000)} км/с`]},
()=>['Спутник обращается вокруг Земли на высоте h = R (R = 6400 км). Найдите его скорость и период обращения. (Первая космическая скорость 7,9 км/с.)','v = v₁/√2 ≈ 5,6 км/с; T = 2π·2R/v ≈ 1,44·10⁴ с ≈ 4 ч'],
()=>['Во сколько раз период обращения спутника на высоте h = 3R больше периода спутника, летящего у самой поверхности Земли? Ответ обоснуйте формулами.','r в 4 раза больше, v в 2 раза меньше ⇒ T = 2πr/v больше в 8 раз']]},
{r:/тяготен/i,tp:'grav',ill:'grav',
goals:['Знать закон всемирного тяготения и смысл гравитационной постоянной.','Применять закон к расчёту сил притяжения.','Объяснять силу тяжести как частный случай тяготения.'],
idea:['Все тела притягиваются друг к другу. Сила притяжения пропорциональна произведению масс и обратно пропорциональна квадрату расстояния между их центрами.','F = G·m₁m₂/r², G ≈ 6,67·10⁻¹¹ Н·м²/кг² — гравитационная постоянная (её измерил Г. Кавендиш).','Формула точна для материальных точек и однородных шаров (r — расстояние между центрами).','Сила тяжести у поверхности Земли — частный случай: mg = G·mM/R².'],
f:['F = G·m₁m₂ / r²','G ≈ 6,67·10⁻¹¹ Н·м²/кг²','mg = G·mM / R²'],
ex:['С какой силой притягиваются два корабля массами по 10 000 т на расстоянии 1 км?','Дано: m₁ = m₂ = 10⁷ кг, r = 10³ м. Решение: F = G·m₁m₂/r² = 6,67·10⁻¹¹·10¹⁴/10⁶ ≈ 6,7·10⁻³ Н. Ответ: ≈ 6,7 мН — очень малая сила.'],
chk:[['Расстояние между телами уменьшили в 3 раза. Как изменилась сила притяжения?','Увеличилась в 9 раз.'],['Почему мы не замечаем притяжения к соседу по парте?','Массы малы, а G очень мала: сила порядка 10⁻⁷ Н.'],['Во сколько раз уменьшится сила притяжения к Земле на высоте h = R?','В 4 раза.']],
err:['Берут расстояние между поверхностями тел вместо расстояния между центрами.','Ошибаются в степенях десяти.'],
hw:[()=>{const k=RN([2,3,4]);return[`Расстояние между двумя телами увеличили в ${k} раза, а массу каждого тела — в 2 раза. Как изменилась сила их притяжения?`,`F₂/F₁ = 2·2/${k}² = ${N2(4/(k*k))}`]},
()=>{const m=RN([50,60,80]);return[`Найдите силу притяжения двух учеников массами ${m} кг и 50 кг на расстоянии 1 м. Сравните её с силой тяжести одного ученика массой 50 кг (g = 10 м/с²).`,`F = 6,67·10⁻¹¹·${m}·50/1 ≈ ${N2(6.67*m*50/1e4)}·10⁻⁷ Н; это примерно в ${N2(500/(6.67e-11*m*50)/1e9)}·10⁹ раз меньше 500 Н`]},
()=>['Масса Земли 6·10²⁴ кг, радиус 6,4·10⁶ м. Найдите по закону всемирного тяготения ускорение свободного падения у поверхности Земли и на высоте 6400 км.','g = GM/R² ≈ 9,8 м/с²; на высоте R: g/4 ≈ 2,4 м/с²']]},
{r:/задач[а-яё]* по динамик|повторени[а-яё]* .*динамик|законы ньютона|силы в механике/i,tp:'new',ill:'new',
goals:['Повторить законы Ньютона и силы в механике.','Решать комбинированные задачи по алгоритму.','Подготовиться к суммативному оцениванию по разделу.'],
idea:['1-й закон: при ΣF = 0 тело покоится или движется равномерно (в ИСО).','2-й закон: m·a⃗ = ΣF⃗; 3-й закон: F⃗₁₂ = −F⃗₂₁, силы приложены к разным телам.','Силы: тяжести mg, упругости kΔl, трения μN, вес P = m(g ± a), тяготения Gm₁m₂/r².','Алгоритм: рисунок → оси → 2-й закон в проекциях → решение → проверка единиц.'],
f:['m·a⃗ = ΣF⃗','F = kΔl','Fтр = μN','P = m(g ± a)','F = Gm₁m₂/r²','a = g(sinα − μcosα)'],
ex:['Брусок массой 2 кг тянут вверх по наклонной плоскости (α = 30°) силой 18 Н вдоль склона. μ = 0,2. Найдите ускорение (g = 10 м/с², cos30° ≈ 0,87).','Решение: ось вдоль склона вверх: ma = F − mg·sinα − μmg·cosα = 18 − 10 − 3,48 = 4,52 Н ⇒ a ≈ 2,3 м/с². Ответ: ≈ 2,3 м/с².'],
chk:[['Какая сила сообщает ускорение автомобилю при разгоне?','Сила трения покоя колёс о дорогу.'],['Груз 5 кг на пружине (k = 500 Н/м) в покое. Удлинение?','10 см'],['Лифт свободно падает. Вес пассажира?','Ноль — невесомость.']],
err:['Забывают силу трения или реакцию опоры.','Ошибки в проекциях на наклонной плоскости.'],
hw:[()=>{const m=RN([60,70]),a=RN([2,3]);return[`Пассажир массой ${m} кг стоит на весах в лифте. Что покажут весы при разгоне лифта вниз с ускорением ${a} м/с²? Сделайте рисунок сил (g = 10 м/с²).`,`P = m(g − a) = ${m*(10-a)} Н (весы в ньютонах), «${N2(m*(10-a)/10)} кг» по шкале`]},
()=>{const m=RN([1,2]),k=RN([200,400]),mu=0.25,a=RN([1,2]);return[`Брусок массой ${m} кг тянут по столу с помощью пружины жёсткостью ${k} Н/м так, что он движется с ускорением ${a} м/с². μ = 0,25. Найдите удлинение пружины (g = 10 м/с²).`,`kΔl = m(a + μg) ⇒ Δl = ${N2(m*(a+mu*10)/k*100)} см`]},
()=>['Санки съезжают с горки высотой 5 м и длиной склона 10 м, затем едут по горизонтали. Коэффициент трения везде 0,1. Найдите ускорение на склоне и путь по горизонтали до остановки (g = 10 м/с², sinα = 0,5, cosα ≈ 0,87).','на склоне a = g(0,5 − 0,087) ≈ 4,1 м/с², v² = 2aL ≈ 82,6 м²/с²; по горизонтали a = μg = 1 м/с², s = v²/(2μg) ≈ 41 м']]},
{r:/сила тяжести|^сила[^а-яё]/i,tp:'new',ill:'new',
goals:['Знать, что сила — мера взаимодействия тел, и единицу силы.','Рассчитывать силу тяжести.','Изображать силы стрелками в масштабе.'],
idea:['Сила — векторная величина, мера действия одного тела на другое. Сила характеризуется модулем, направлением и точкой приложения.','Единица силы — ньютон (Н). Силу измеряют динамометром.','Сила тяжести — сила, с которой Земля притягивает тело: F = mg, направлена вертикально вниз, g ≈ 9,8 Н/кг (≈ 10 Н/кг).','Силы изображают стрелками: длина стрелки — модуль силы в выбранном масштабе.'],
f:['F = m·g','g ≈ 9,8 Н/кг ≈ 10 Н/кг','[F] = Н'],
ex:['Найдите силу тяжести, действующую на ведро воды объёмом 10 л. Масса пустого ведра 1 кг (ρ = 1000 кг/м³, g = 10 Н/кг).','Решение: m воды = ρV = 1000·0,01 = 10 кг; m = 11 кг; F = mg = 110 Н. Ответ: 110 Н.'],
chk:[['Чему равна сила тяжести, действующая на тело массой 3 кг?','≈ 30 Н'],['Куда направлена сила тяжести?','Вертикально вниз, к центру Земли.'],['Каким прибором измеряют силу?','Динамометром.']],
err:['Путают массу (кг) и силу тяжести (Н).','Забывают переводить граммы и литры.'],
hw:[()=>{const m=RN([200,500,800]);return[`Найдите силу тяжести, действующую на тело массой ${m} г (g = 10 Н/кг). Изобразите её стрелкой в масштабе 1 клетка = 1 Н.`,`F = ${N2(m/1000*10)} Н`]},
()=>{const V=RN([2,5,10]);return[`Найдите силу тяжести, действующую на ${V} л подсолнечного масла (ρ = 900 кг/м³, g = 10 Н/кг).`,`m = ρV = ${N2(0.9*V)} кг; F = ${N2(9*V)} Н`]},
()=>['На Луне сила тяжести в 6 раз меньше, чем на Земле. Какую массу груза сможет поднять на Луне человек, который на Земле поднимает 50 кг? Изменится ли масса груза при перевозке на Луну?','≈ 300 кг; масса не меняется, меняется сила тяжести']]},
{r:/внутреннего сгорания/i,tp:'ter',ill:'ter',
goals:['Знать устройство и четыре такта двигателя внутреннего сгорания.','Объяснять превращения энергии в ДВС.','Рассчитывать КПД двигателя.'],
idea:['ДВС — тепловой двигатель, в котором топливо сгорает прямо внутри цилиндра.','Основные части: цилиндр, поршень, шатун, коленчатый вал, впускной и выпускной клапаны, свеча (у бензинового).','Четыре такта: впуск → сжатие → рабочий ход → выпуск. Полезную работу газ совершает только в такте «рабочий ход».','КПД бензиновых ДВС около 25–30 %, дизельных — до 40 %; остальная энергия уходит в окружающую среду.'],
f:['η = Aп / Q · 100 %','Q = q·m','Aп = N·t'],
ex:['Четырёхтактный двигатель делает 3000 оборотов коленчатого вала в минуту. Сколько рабочих ходов совершается в одном цилиндре за 1 с?','Решение: один цикл (4 такта) — 2 оборота вала. 3000 об/мин = 50 об/с ⇒ 25 циклов в секунду. Ответ: 25 рабочих ходов.'],

function qDates(q,days){const r=[];for(let d=pd(QD[q][0]);d<=pd(QD[q][1]);d.setDate(d.getDate()+1))if(days.includes(d.getDay())&&!HOL[iso(d)])r.push(iso(d));return r}
// типовой план: если уроков больше, чем дат, объединяем соседние уроки одного раздела, чтобы у всех (и у СОР/СОЧ) была дата
function mkLessons(g,days){const out=[];(DPL[g]||DPL[9]).forEach((secs,q)=>{let it=[];secs.forEach(([n,tp,ls])=>{ls.forEach(t=>it.push({t,sec:n,tp:tp.slice(),kind:/^Л\/р/.test(t)?'lab':'lesson'}));if(ls.length>2||secs.length==1)it.push({t:'СОР: «'+n+'»',sec:n,tp:tp.slice(),kind:'sor'})});
const ds=qDates(q,days),last=secs[secs.length-1];while(it.length+1<ds.length)it.push({t:'Повторение и решение задач',sec:last[0],tp:last[1].slice(),kind:'lesson'});it.push({t:'СОЧ за '+(q+1)+' четверть',sec:'',tp:[],kind:'soch'});
for(let guard=0;it.length>ds.length&&guard<40;guard++){let k=-1;for(let i=it.length-2;i>=0;i--){const a=it[i],b=it[i+1];if(a.kind=='lesson'&&b.kind=='lesson'&&a.sec==b.sec&&!a.mg&&!b.mg){k=i;break}}if(k<0)break;it.splice(k,2,{...it[k],t:it[k].t+'. '+it[k+1].t,mg:1})}
it.forEach((x,k)=>{delete x.mg;out.push({id:q+'-'+k,q,d:ds[k]||'',...x,pres:null,hw:null})})});return out}
// --- освоение: оценки за ДЗ и тренировки на сайте отдельно; стартовое значение (не тренировался) не считается ---
const trained=(pl,t)=>!!pl&&pl[t]!=null&&Math.abs(pl[t]-K.L0)>.001;
function secParts(plan,sec,uid,pl){const ls=plan.lessons.filter(l=>l.sec==sec),ids=new Set(ls.map(l=>l.id)),hs=SUB.filter(x=>x.uid==uid&&x.planId==plan.id&&ids.has(x.lid)).map(finG).filter(x=>x!=null),tps=[...new Set(ls.flatMap(tpOf))].filter(t=>trained(pl,t));
return{h:hs.length?hs.reduce((a,x)=>a+x,0)/hs.length:null,hn:hs.length,b:tps.length?Math.round(tps.reduce((a,t)=>a+pl[t],0)/tps.length*100):null}}
function secM(plan,sec,uid,pl){const{h,b}=secParts(plan,sec,uid,pl),hh=h==null?null:h*10;return b==null&&hh==null?null:Math.round(b==null?hh:hh==null?b:(b+hh)/2)}
function tGrades(uid,plan){const s=SUB.filter(x=>x.uid==uid&&(!plan||x.planId==plan.id)).map(finG).filter(x=>x!=null);return s.length?{a:s.reduce((a,x)=>a+x,0)/s.length,n:s.length}:null}
function trainQ(r,plan,q){const tps=[...new Set(plan.lessons.filter(l=>l.q==q).flatMap(tpOf))].filter(t=>trained(r.pl,t));return tps.length?Math.round(tps.reduce((a,t)=>a+r.pl[t],0)/tps.length*100):null}

function qTopics(q){const p=S&&S.role=='st'&&S.grade&&S.grade<11?myPlan():null;if(!p)return[];return[...new Set(p.lessons.filter(l=>q==null?l.q<=qNow():l.q==q).flatMap(tpOf))]}

// поворот на 90° через canvas — чтобы повёрнутое фото помещалось в окно и прокручивалось
function phRot(){const im=new Image();im.onload=()=>{const c=document.createElement('canvas');c.width=im.height;c.height=im.width;const x=c.getContext('2d');x.translate(c.width/2,c.height/2);x.rotate(Math.PI/2);x.drawImage(im,-im.width/2,-im.height/2);if(M.ph){M.ph.rs=c.toDataURL('image/jpeg',.8);draw(0)}};im.src=M.ph.rs||phSrc()}

const TUTOR=g=>`Ты — ИИ-наставник по физике сайта AdaptiveLearn для ученика ${g||8} класса школы Казахстана (обновлённое содержание образования). Твоя цель — НАУЧИТЬ, а не выдать ответ.
Правила:
1. Найди КАЖДУЮ ошибку и назови точное место (какая строка/шаг).
2. Объясни, ПОЧЕМУ это ошибка: какую физическую идею ученик понял неверно (например «путает массу и вес», «забыл перевести в СИ», «сила трения направлена против движения, а не вниз»). Не ограничивайся словами «неверно посчитал».
3. Покажи, как исправить именно этот шаг.
4. Дай ПОЛНОЕ подробное решение, где КАЖДЫЙ ход обоснован: какой закон или формула, ПОЧЕМУ она применима здесь (условия применимости), что означает каждая величина, перевод в СИ, подстановка, вычисление.
5. Проверь ответ: единицы (размерность) и правдоподобие (реальна ли такая величина).
6. Конкретно похвали верные шаги — ученик должен знать, что у него уже получается.
7. Пиши по-русски, просто, тепло, на «ты», короткими предложениями. Без LaTeX: пиши v², ·, √, Δt, м/с.
8. Только школьная физика ${g||8} класса. Не выдумывай: если на фото что-то не читается — так и скажи.`;
